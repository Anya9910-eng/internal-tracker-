<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANEON — облік тендерів</title>
<style>
  :root{
    --bg:#0b1220; --bg-2:#0e1626; --surface:#111c30; --surface-2:#13203a; --surface-3:#1a2b48;
    --line:#223354; --line-strong:#2f456e; --fg:#eaf1fb; --muted:#9fb0cc; --muted-2:#6f84a6;
    --accent:#2f6df0; --accent-bright:#5b8cff; --accent-soft:#17315f;
    --good:#49c17a; --warn:#e6b23c; --bad:#ff8f78; --gold:#f2c94c;
    --radius:16px; --radius-sm:12px; --shadow:0 18px 40px -20px rgba(0,0,0,.7);
    --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    --font-display:var(--font); --font-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:
      radial-gradient(1200px 600px at 80% -10%, #16233f 0%, transparent 60%),
      var(--bg); color:var(--fg); font-family:var(--font); font-size:15px; line-height:1.4;
      -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;cursor:pointer}
  .in{width:100%;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;color:var(--fg);
      font-size:14px;padding:11px 12px;outline:none}
  .in:focus{border-color:var(--accent)}
  textarea.in{resize:vertical;min-height:62px;line-height:1.45}
  label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);
        font-weight:700;margin-bottom:6px}
  .btn{background:var(--accent);border:none;color:#fff;font-weight:700;font-size:14px;padding:11px 16px;
       border-radius:10px;transition:filter .15s}
  .btn:hover{filter:brightness(1.07)}
  .btn.block{width:100%}
  .btn.ghost{background:var(--surface-2);border:1px solid var(--line);color:var(--fg)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn.danger{background:#3a1d22;border:1px solid #5e2a30;color:#ffb3a7}

  /* ---------- auth ---------- */
  .auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px}
  .auth[hidden]{display:none}
  .auth-card{width:100%;max-width:440px;background:var(--surface);border:1px solid var(--line);
             border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
  .mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
        background:linear-gradient(150deg,var(--accent-bright),var(--accent));font-weight:800;font-size:19px;color:#fff}
  .brand b{font-weight:800;font-size:18px;display:block;line-height:1.1}
  .brand span{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .auth h1{font-size:21px;margin:0 0 4px}
  .auth .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .field{margin-bottom:14px}
  .err{background:#2a1820;border:1px solid #5e2a30;color:#ffb3a7;font-size:13px;padding:10px 12px;
       border-radius:10px;margin-bottom:14px;line-height:1.45}
  .switch{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}
  .switch button{background:none;border:none;color:var(--accent-bright);font-weight:700;padding:0;font-size:13px}
  .switch .sep{margin:0 8px;color:var(--line-strong)}

  /* ---------- app shell ---------- */
  .wrap{max-width:1500px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0)) 40px}
  .topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px}
  .topbar .brand{margin:0}
  .topbar .mark{width:40px;height:40px;border-radius:11px;font-size:17px}
  .spacer{flex:1 1 auto}
  .search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
          border-radius:999px;padding:8px 14px;min-width:220px}
  .search input{background:none;border:none;color:var(--fg);outline:none;font-size:14px;width:100%}
  .profbtn{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);
           border-radius:999px;padding:6px 14px 6px 6px;color:var(--fg);font-weight:600;font-size:14px}
  .profbtn .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-bright);
               display:grid;place-items:center;font-weight:800;font-size:12px}

  /* ---------- board ---------- */
  .board{display:flex;gap:14px;overflow-x:auto;padding-bottom:12px;align-items:flex-start}
  .board::-webkit-scrollbar{height:9px}.board::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
  .col{flex:0 0 320px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
       display:flex;flex-direction:column;max-height:calc(100vh - 150px)}
  .col.drag-over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft) inset}
  .col-head{display:flex;align-items:center;gap:8px;padding:13px 14px 10px}
  .col-head .nm{font-weight:800;font-size:14px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .col-head .cnt{color:var(--muted-2);font-size:12px;font-weight:700;background:var(--bg-2);border-radius:999px;padding:2px 8px}
  .col-head .ca{display:flex;gap:3px;opacity:0;transition:opacity .15s}
  .col:hover .col-head .ca{opacity:1}
  .col-head .ca button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--surface-2);
                       color:var(--muted);font-size:12px;display:grid;place-items:center}
  .col-head .ca button:hover{color:var(--fg);border-color:var(--line-strong)}
  .cards{display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:4px 12px;min-height:30px}
  .cards::-webkit-scrollbar{width:8px}.cards::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:8px}
  .addt{margin:6px 12px 14px;border:1px dashed var(--line-strong);background:none;color:var(--muted);
        border-radius:10px;padding:10px;font-weight:600;font-size:13px}
  .addt:hover{color:var(--fg);border-color:var(--accent)}

  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);
        padding:13px 14px;cursor:pointer;transition:border-color .15s;display:flex;flex-direction:column;gap:9px}
  .card:hover{border-color:var(--line-strong)}
  .card.dragging{opacity:.5}
  .card .buyer{font-weight:700;font-size:14.5px;line-height:1.3;word-break:break-word}
  .card .prod{color:var(--muted);font-size:13px;line-height:1.35;word-break:break-word}
  .card-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px}
  .chip{display:inline-flex;align-items:center;gap:4px;background:var(--bg-2);border:1px solid var(--line);
        border-radius:999px;padding:3px 9px;color:var(--muted);font-weight:600;max-width:100%;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap}
  .chip.c-none{color:var(--muted-2)}
  .chip.c-unsigned{color:#f0c572;border-color:#4a3c1c;background:#231c0c}
  .chip.c-signed{color:#7ee0a6;border-color:#1e4631;background:#0e2619}
  .chip.deliver{color:#8fb6ff;border-color:#243a66;background:#0f1d38}

  /* ---------- sheet / modal ---------- */
  .scrim{position:fixed;inset:0;background:rgba(5,10,20,.66);backdrop-filter:blur(3px);z-index:50;
         display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
  .scrim[hidden]{display:none}
  .sheet{width:100%;max-width:620px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
         box-shadow:var(--shadow);margin:auto}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-size:17px;margin:0;flex:1}
  .sheet-head .x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);
                 color:var(--muted);font-size:15px}
  .sheet-body{padding:18px;display:flex;flex-direction:column;gap:14px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{display:inline-flex;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
  .seg button{border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:7px 14px;border-radius:7px}
  .seg button.on{background:var(--accent);color:#fff}
  .seg.green button.on{background:var(--good)}
  .section-cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:700;
               margin-top:4px;padding-top:12px;border-top:1px solid var(--line)}
  .sheet-foot{display:flex;align-items:center;gap:10px;padding:14px 18px;border-top:1px solid var(--line)}
  .hint{color:var(--muted-2);font-size:12px}

  .crew-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
  .crew-row:last-child{border-bottom:none}
  .crew-row .nm{flex:1;font-weight:600}
  .crew-row .tag{font-size:11px;color:var(--muted-2)}

  .toast:empty{display:none}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(calc(100% + 50px));z-index:70;
         background:var(--surface-3);border:1px solid var(--gold);color:var(--fg);padding:11px 18px;border-radius:999px;
         font-weight:600;font-size:13px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
  .toast.show{transform:translateX(-50%) translateY(0)}

  .empty{color:var(--muted-2);text-align:center;padding:30px 16px;font-size:13px}
  @media (max-width:560px){ .row2{grid-template-columns:1fr} .col{flex-basis:84vw} }
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth" id="authScreen" hidden>
  <div class="auth-card">
    <div class="brand"><div class="mark">AT</div><div><b>ANEON</b><span>Облік тендерів</span></div></div>
    <h1 id="authTitle">З поверненням</h1>
    <p class="sub" id="authSub">Увійдіть, щоб відкрити свою дошку тендерів.</p>
    <div class="err" id="authErr" hidden></div>
    <form id="authForm">
      <div class="field" id="nameField" hidden>
        <label for="aName">Ваше ім'я</label>
        <input class="in" id="aName" autocomplete="name" placeholder="Як вас підписувати">
      </div>
      <div class="field"><label for="aEmail">Email</label>
        <input class="in" id="aEmail" type="email" autocomplete="email" placeholder="you@company.com" required></div>
      <div class="field"><label for="aPass">Пароль</label>
        <input class="in" id="aPass" type="password" autocomplete="current-password" placeholder="Щонайменше 8 символів" required></div>
      <button class="btn block" id="authSubmit" type="submit">Увійти</button>
    </form>
    <div class="switch" id="authSwitch"></div>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="wrap">
    <div class="topbar">
      <div class="brand"><div class="mark">AT</div><div><b>ANEON</b><span>Облік тендерів</span></div></div>
      <div class="spacer"></div>
      <div class="search"><span>🔎</span><input id="search" placeholder="Пошук: покупець або товар"></div>
      <button class="btn ghost sm" id="addStage">+ Стадія</button>
      <button class="profbtn" id="profBtn"><span class="av" id="profAv">?</span><span id="profName">—</span></button>
    </div>
    <div class="board" id="board"></div>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const initials = n => (n||"").trim().split(/\s+/).map(w=>w[0]||"").join("").replace(/[^\p{L}\p{N}]/gu,"").slice(0,2).toUpperCase() || "?";

  async function api(method, url, body){
    const r = await fetch(url, { method, headers: body?{"Content-Type":"application/json"}:{}, body: body?JSON.stringify(body):undefined });
    const ct = r.headers.get("content-type")||"";
    const data = ct.includes("json") ? await r.json() : null;
    if(!r.ok){ const e = new Error((data&&data.error)||("Помилка "+r.status)); e.status=r.status; throw e; }
    return data;
  }

  const state = { me:null, stages:[], users:[], adminId:null };
  let filter = "";

  /* ---------- auth ---------- */
  let mode = "login";
  function showAuth(){ $("#app").hidden=true; $("#authScreen").hidden=false; teardownSSE(); renderAuthMode(); }
  function enterApp(){ $("#authScreen").hidden=true; $("#app").hidden=false; }
  function renderAuthMode(){
    const signup = mode==="signup";
    $("#authTitle").textContent = signup ? "Створення акаунта" : "З поверненням";
    $("#authSub").textContent = signup ? "Приєднайтесь до дошки тендерів — це кілька секунд." : "Увійдіть, щоб відкрити свою дошку тендерів.";
    $("#nameField").hidden = !signup;
    $("#aName").required = signup;
    $("#authSubmit").textContent = signup ? "Створити акаунт" : "Увійти";
    $("#aPass").autocomplete = signup ? "new-password" : "current-password";
    $("#authSwitch").innerHTML = signup
      ? `Вже є акаунт? <button type="button" id="toLogin">Увійти</button>`
      : `Немає акаунта? <button type="button" id="toSignup">Створити</button><span class="sep">·</span><button type="button" id="toForgot">Забули пароль?</button>`;
    const sw = $("#"+(signup?"toLogin":"toSignup")); if(sw) sw.onclick=()=>{ mode=signup?"login":"signup"; hideErr(); renderAuthMode(); };
    const fg = $("#toForgot"); if(fg) fg.onclick=()=>showErr("Скидання паролю поки без email. Попросіть адміністратора скинути ваш пароль — він робить це у своєму профілі → Користувачі, і дає вам тимчасовий пароль для входу.");
    hideErr();
  }
  function showErr(m){ const e=$("#authErr"); e.textContent=m; e.hidden=false; }
  function hideErr(){ $("#authErr").hidden=true; }

  $("#authForm").addEventListener("submit", async e => {
    e.preventDefault(); hideErr();
    const name=$("#aName").value.trim(), email=$("#aEmail").value.trim(), password=$("#aPass").value;
    try{
      if(mode==="signup") await api("POST","/api/auth/signup",{name,email,password});
      else await api("POST","/api/auth/login",{email,password});
      enterApp(); await loadBoard(); openSSE();
    }catch(err){ showErr(err.message); }
  });

  /* ---------- board ---------- */
  async function boot(){
    try{ const r = await api("GET","/api/me"); state.me=r.user; enterApp(); await loadBoard(); openSSE(); }
    catch(err){ showAuth(); }
  }
  async function loadBoard(){
    try{
      const d = await api("GET","/api/board");
      state.me=d.me; state.stages=d.stages||[]; state.users=d.users||[]; state.adminId=d.adminId;
      renderTopbar(); renderBoard();
    }catch(err){ if(err.status===401) showAuth(); }
  }
  function renderTopbar(){
    const p=state.me; if(!p) return;
    $("#profName").textContent=p.name;
    $("#profAv").textContent=initials(p.name);
  }

  function contractChip(t){
    if(!t.contractExists) return `<span class="chip c-none">Договір: немає</span>`;
    return t.contractSigned
      ? `<span class="chip c-signed">✓ Договір підписано</span>`
      : `<span class="chip c-unsigned">Договір: не підписано</span>`;
  }
  function tenderCard(t){
    const el=document.createElement("div");
    el.className="card"; el.draggable=true; el.dataset.id=t.id;
    const meta=[];
    meta.push(contractChip(t));
    if(t.deliveryTerms) meta.push(`<span class="chip deliver" title="Строки поставки">🚚 ${esc(t.deliveryTerms)}</span>`);
    if(t.packaging) meta.push(`<span class="chip" title="Пакування">📦 ${esc(t.packaging)}</span>`);
    el.innerHTML =
      `<div class="buyer">${esc(t.buyer)||"<span style='color:var(--muted-2)'>Без назви покупця</span>"}</div>`
      + (t.product?`<div class="prod">${esc(t.product)}</div>`:"")
      + `<div class="card-meta">${meta.join("")}</div>`;
    el.addEventListener("click", ()=>openTender(t.id));
    el.addEventListener("dragstart", e=>{ dragId=t.id; el.classList.add("dragging"); e.dataTransfer.effectAllowed="move"; });
    el.addEventListener("dragend", ()=>{ dragId=null; el.classList.remove("dragging"); });
    return el;
  }

  function matches(t){
    if(!filter) return true;
    const q=filter.toLowerCase();
    return (t.buyer||"").toLowerCase().includes(q) || (t.product||"").toLowerCase().includes(q);
  }

  function renderBoard(){
    const board=$("#board"); board.innerHTML="";
    if(!state.stages.length){ board.innerHTML=`<div class="empty">Ще немає стадій. Додайте першу кнопкою «+ Стадія».</div>`; return; }
    state.stages.forEach(s=>{
      const list=s.tenders.filter(matches);
      const col=document.createElement("div"); col.className="col"; col.dataset.stage=s.id;
      col.innerHTML=
        `<div class="col-head">
           <span class="nm" data-rename="${s.id}" title="${esc(s.name)}">${esc(s.name)}</span>
           <span class="cnt">${s.tenders.length}</span>
           <span class="ca">
             <button data-mv="left" data-s="${s.id}" title="Ліворуч">‹</button>
             <button data-mv="right" data-s="${s.id}" title="Праворуч">›</button>
             <button data-rename="${s.id}" title="Перейменувати">✎</button>
             <button data-delstage="${s.id}" title="Видалити стадію">🗑</button>
           </span>
         </div>
         <div class="cards" data-cards="${s.id}"></div>
         <button class="addt" data-addt="${s.id}">+ Додати тендер</button>`;
      const cards=col.querySelector(".cards");
      list.forEach(t=>cards.appendChild(tenderCard(t)));
      if(!list.length) cards.innerHTML=`<div class="empty" style="padding:14px">${filter?"Нічого не знайдено":"Порожньо"}</div>`;
      wireDrop(col, cards, s.id);
      board.appendChild(col);
    });
  }

  /* ---------- drag & drop ---------- */
  let dragId=null;
  function afterElement(container, y){
    const els=[...container.querySelectorAll(".card:not(.dragging)")];
    let closest=null, closestOffset=-Infinity;
    for(const el of els){ const box=el.getBoundingClientRect(); const off=y-box.top-box.height/2;
      if(off<0 && off>closestOffset){ closestOffset=off; closest=el; } }
    return closest;
  }
  function wireDrop(col, cards, stageId){
    col.addEventListener("dragover", e=>{ if(!dragId) return; e.preventDefault(); col.classList.add("drag-over"); });
    col.addEventListener("dragleave", e=>{ if(!col.contains(e.relatedTarget)) col.classList.remove("drag-over"); });
    col.addEventListener("drop", async e=>{
      if(!dragId) return; e.preventDefault(); col.classList.remove("drag-over");
      const after=afterElement(cards, e.clientY);
      const beforeId=after?after.dataset.id:null;
      const id=dragId; dragId=null;
      try{ await api("POST","/api/tenders/"+id+"/move",{stageId, beforeId}); await loadBoard(); }
      catch(err){ toast("⚠️ "+err.message); }
    });
  }

  /* ---------- board actions ---------- */
  $("#board").addEventListener("click", e=>{
    let m;
    if((m=e.target.closest("[data-addt]"))) addTender(m.dataset.addt);
    else if((m=e.target.closest("[data-mv]"))) moveStage(m.dataset.s, m.dataset.mv);
    else if((m=e.target.closest("[data-rename]"))) renameStage(m.dataset.rename);
    else if((m=e.target.closest("[data-delstage]"))) delStage(m.dataset.delstage);
  });
  async function addTender(stageId){
    try{ const r=await api("POST","/api/stages/"+stageId+"/tenders",{}); await loadBoard(); openTender(r.id); }
    catch(err){ toast("⚠️ "+err.message); }
  }
  async function moveStage(id, dir){ try{ await api("POST","/api/stages/"+id+"/move",{dir}); await loadBoard(); }catch(err){ toast("⚠️ "+err.message); } }
  async function renameStage(id){
    const s=state.stages.find(x=>x.id===id); if(!s) return;
    const name=prompt("Назва стадії:", s.name); if(name==null) return;
    try{ await api("PATCH","/api/stages/"+id,{name:name.trim()||s.name}); await loadBoard(); }catch(err){ toast("⚠️ "+err.message); }
  }
  async function delStage(id){
    const s=state.stages.find(x=>x.id===id); if(!s) return;
    const n=s.tenders.length;
    if(!confirm(`Видалити стадію «${s.name}»?`+(n?`\nРазом з нею буде видалено тендерів: ${n}.`:""))) return;
    try{ await api("DELETE","/api/stages/"+id); await loadBoard(); }catch(err){ toast("⚠️ "+err.message); }
  }
  $("#addStage").onclick=async()=>{
    const name=prompt("Назва нової стадії:"); if(name==null) return;
    try{ await api("POST","/api/stages",{name:name.trim()||"Нова стадія"}); await loadBoard(); }catch(err){ toast("⚠️ "+err.message); }
  };
  $("#search").addEventListener("input", e=>{ filter=e.target.value.trim(); renderBoard(); });

  /* ---------- tender editor ---------- */
  function findTender(id){ for(const s of state.stages){ const t=s.tenders.find(x=>x.id===id); if(t) return t; } return null; }
  function openTender(id){
    const t=findTender(id); if(!t) return;
    const stageOpts=state.stages.map(s=>`<option value="${s.id}" ${s.id===t.stageId?"selected":""}>${esc(s.name)}</option>`).join("");
    openSheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Тендер">
      <div class="sheet-head"><h2>Картка тендера</h2><button class="x" data-close aria-label="Закрити">✕</button></div>
      <div class="sheet-body">
        <div class="field"><label for="fBuyer">Найменування покупця</label><input class="in" id="fBuyer" value="${esc(t.buyer)}" placeholder="Напр. КП «Міська лікарня №4»"></div>
        <div class="row2">
          <div class="field"><label for="fProduct">Найменування товару</label><input class="in" id="fProduct" value="${esc(t.product)}"></div>
          <div class="field"><label for="fStage">Стадія</label><select class="in" id="fStage">${stageOpts}</select></div>
        </div>
        <div class="row2">
          <div class="field"><label for="fPack">Пакування</label><input class="in" id="fPack" value="${esc(t.packaging)}" placeholder="Напр. 100 шт/уп, 10 уп/кор"></div>
          <div class="field"><label for="fDeliv">Строки поставки</label><input class="in" id="fDeliv" value="${esc(t.deliveryTerms)}" placeholder="Напр. до 15 днів"></div>
        </div>
        <div class="field"><label for="fSpec">Специфікація</label><textarea class="in" id="fSpec" placeholder="ДСТУ, матеріал, характеристики…">${esc(t.specification)}</textarea></div>

        <div class="section-cap">Договір</div>
        <div class="row2">
          <div class="field"><label>Договір</label><div class="seg" id="segExists">
            <button type="button" data-v="1" class="${t.contractExists?"on":""}">Є</button>
            <button type="button" data-v="0" class="${!t.contractExists?"on":""}">Немає</button></div></div>
          <div class="field"><label>Статус підпису</label><div class="seg green" id="segSigned">
            <button type="button" data-v="1" class="${t.contractSigned?"on":""}">Підписаний</button>
            <button type="button" data-v="0" class="${!t.contractSigned?"on":""}">Не підписаний</button></div></div>
        </div>

        <div class="section-cap">Реквізити</div>
        <div class="field"><label for="fReqS">Реквізити для відправки зразка</label><textarea class="in" id="fReqS">${esc(t.reqSample)}</textarea></div>
        <div class="field"><label for="fReqO">Реквізити для відправки замовлення</label><textarea class="in" id="fReqO">${esc(t.reqOrder)}</textarea></div>
        <div class="field"><label for="fReqD">Реквізити для відправки документів</label><textarea class="in" id="fReqD">${esc(t.reqDocs)}</textarea></div>

        <div class="section-cap">Інше</div>
        <div class="field"><label for="fNotes">Нотатки</label><textarea class="in" id="fNotes">${esc(t.notes)}</textarea></div>
      </div>
      <div class="sheet-foot">
        <button class="btn danger sm" id="fDelete">Видалити</button>
        <span class="hint" id="fSaved"></span>
        <span style="flex:1"></span>
        <button class="btn ghost sm" data-close>Закрити</button>
        <button class="btn" id="fSave">Зберегти</button>
      </div></div>`);

    let exists=t.contractExists?1:0, signed=t.contractSigned?1:0;
    $("#segExists").onclick=e=>{ const b=e.target.closest("button[data-v]"); if(!b)return; exists=+b.dataset.v;
      document.querySelectorAll("#segExists button").forEach(x=>x.classList.toggle("on",+x.dataset.v===exists)); };
    $("#segSigned").onclick=e=>{ const b=e.target.closest("button[data-v]"); if(!b)return; signed=+b.dataset.v;
      document.querySelectorAll("#segSigned button").forEach(x=>x.classList.toggle("on",+x.dataset.v===signed)); };

    $("#fDelete").onclick=async()=>{
      if(!confirm("Видалити цей тендер?")) return;
      try{ await api("DELETE","/api/tenders/"+t.id); closeSheet(); await loadBoard(); toast("Тендер видалено"); }
      catch(err){ toast("⚠️ "+err.message); }
    };
    $("#fSave").onclick=async()=>{
      const body={
        buyer:$("#fBuyer").value.trim(), product:$("#fProduct").value.trim(), packaging:$("#fPack").value.trim(),
        deliveryTerms:$("#fDeliv").value.trim(), specification:$("#fSpec").value, reqSample:$("#fReqS").value,
        reqOrder:$("#fReqO").value, reqDocs:$("#fReqD").value, notes:$("#fNotes").value,
        contractExists:!!exists, contractSigned:!!signed
      };
      const newStage=$("#fStage").value;
      try{
        await api("PATCH","/api/tenders/"+t.id, body);
        if(newStage && newStage!==t.stageId) await api("POST","/api/tenders/"+t.id+"/move",{stageId:newStage, beforeId:null});
        closeSheet(); await loadBoard(); toast("Збережено ✓");
      }catch(err){ toast("⚠️ "+err.message); }
    };
  }

  /* ---------- profile ---------- */
  $("#profBtn").onclick=openProfile;
  function openProfile(){
    const p=state.me; const isAdmin=p.id===state.adminId;
    const others=state.users;
    const crew=others.map(u=>{
      const me=u.id===p.id;
      const reset=(isAdmin&&!me)?`<button class="btn ghost sm" data-reset="${u.id}" data-name="${esc(u.name)}">🔑 Скинути пароль</button>`:"";
      const tag=u.id===state.adminId?`<span class="tag">адмін</span>`:"";
      return `<div class="crew-row"><span class="av" style="width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-bright);display:grid;place-items:center;font-weight:800;font-size:12px">${esc(initials(u.name))}</span>
        <span class="nm">${esc(u.name)}${me?" (ви)":""} ${tag}<div class="tag">${esc(u.email)}</div></span>${reset}</div>`;
    }).join("");
    openSheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Профіль">
      <div class="sheet-head"><h2>Профіль</h2><button class="btn ghost sm" id="pLogout">Вийти</button><button class="x" data-close aria-label="Закрити">✕</button></div>
      <div class="sheet-body">
        <div class="field"><label for="pName">Ваше ім'я</label><input class="in" id="pName" value="${esc(p.name)}"></div>
        <div style="display:flex;gap:10px"><button class="btn sm" id="pSaveName">Зберегти ім'я</button></div>

        <div class="section-cap">Зміна паролю</div>
        <div class="field"><label for="pwCur">Поточний пароль</label><input class="in" id="pwCur" type="password" autocomplete="current-password"></div>
        <div class="row2">
          <div class="field"><label for="pwNew">Новий пароль</label><input class="in" id="pwNew" type="password" autocomplete="new-password" placeholder="Мін. 8 символів"></div>
          <div class="field"><label for="pwNew2">Повторіть</label><input class="in" id="pwNew2" type="password" autocomplete="new-password"></div>
        </div>
        <div id="pwMsg" style="display:none;font-size:12px"></div>
        <div><button class="btn ghost sm" id="pwSave">Оновити пароль</button></div>

        <div class="section-cap">Користувачі (${others.length})</div>
        ${crew||`<div class="hint">Поки лише ви.</div>`}
        ${isAdmin?"":`<div class="hint" style="margin-top:8px">Скидати паролі може лише адміністратор.</div>`}
      </div></div>`);

    $("#pLogout").onclick=async()=>{ try{ await api("POST","/api/auth/logout"); }catch(e){} state.me=null; closeSheet(); showAuth(); };
    $("#pSaveName").onclick=async()=>{
      const name=$("#pName").value.trim(); if(!name) return;
      try{ const r=await api("PATCH","/api/me",{name}); state.me=r.user; renderTopbar(); toast("Збережено ✓"); }
      catch(err){ toast("⚠️ "+err.message); }
    };
    const pwSave=$("#pwSave");
    pwSave.onclick=async()=>{
      const msg=$("#pwMsg"), cur=$("#pwCur").value, nw=$("#pwNew").value, nw2=$("#pwNew2").value;
      const show=(t,ok)=>{ msg.style.display="block"; msg.style.color=ok?"var(--good)":"var(--bad)"; msg.textContent=t; };
      if(!cur||!nw){ show("Заповніть поточний і новий пароль.",false); return; }
      if(nw.length<8){ show("Новий пароль має містити щонайменше 8 символів.",false); return; }
      if(nw!==nw2){ show("Нові паролі не збігаються.",false); return; }
      pwSave.disabled=true;
      try{ await api("POST","/api/me/password",{current:cur,next:nw}); show("Пароль оновлено ✓",true);
        $("#pwCur").value=$("#pwNew").value=$("#pwNew2").value=""; }
      catch(err){ show("⚠️ "+err.message,false); }
      finally{ pwSave.disabled=false; }
    };
    const body=$("#scrim");
    body.addEventListener("click", onCrewClick);
    function onCrewClick(e){ const m=e.target.closest("[data-reset]"); if(m) resetTeammatePw(m.dataset.reset, m.dataset.name); }
  }
  async function resetTeammatePw(id, name){
    if(!confirm(`Скинути пароль для «${name||"цього користувача"}»?\nВи отримаєте тимчасовий пароль, щоб передати йому.`)) return;
    try{
      const r=await api("POST","/api/users/"+id+"/reset-password",{});
      openSheet(`<div class="sheet" role="dialog" aria-modal="true" aria-label="Тимчасовий пароль">
        <div class="sheet-head"><h2>Тимчасовий пароль</h2><button class="x" data-close aria-label="Закрити">✕</button></div>
        <div class="sheet-body">
          <p class="hint" style="line-height:1.5">Передайте <b style="color:var(--fg)">${esc(r.name||name||"користувачу")}</b> цей тимчасовий пароль. Він увійде з ним, а потім задасть власний у профілі → Зміна паролю.</p>
          <div class="field"><label>Тимчасовий пароль</label><input class="in" id="tmpPw" readonly value="${esc(r.tempPassword)}" style="font-family:var(--font-mono);font-weight:700;letter-spacing:.5px"></div>
          <div><button class="btn" id="tmpCopy">Копіювати</button></div>
        </div></div>`);
      const inp=$("#tmpPw"); if(inp) inp.onclick=()=>inp.select();
      const cp=$("#tmpCopy"); if(cp) cp.onclick=async()=>{ try{ await navigator.clipboard.writeText(r.tempPassword); toast("Скопійовано ✓"); }catch(e){ if(inp) inp.select(); toast("Виділіть і скопіюйте"); } };
    }catch(err){ toast("⚠️ "+err.message); }
  }

  /* ---------- sheet + toast + SSE ---------- */
  const scrim=$("#scrim");
  function openSheet(html){ scrim.innerHTML=html; scrim.hidden=false; document.body.style.overflow="hidden";
    scrim.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet); }
  function closeSheet(){ scrim.hidden=true; scrim.innerHTML=""; document.body.style.overflow=""; }
  scrim.addEventListener("mousedown", e=>{ if(e.target===scrim) closeSheet(); });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&!scrim.hidden) closeSheet(); });

  let toastT=null;
  function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

  let es=null;
  function openSSE(){ teardownSSE(); try{ es=new EventSource("/api/events"); es.onmessage=()=>loadBoard(); es.onerror=()=>{}; }catch(e){} }
  function teardownSSE(){ if(es){ try{es.close();}catch(e){} es=null; } }

  boot();
})();
</script>
</body>
</html>
