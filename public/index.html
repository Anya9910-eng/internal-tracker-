<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANEON</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  :root{
    --bg:#081423;--bg-2:#0c1d31;--surface:#11263f;--surface-2:#17304e;--surface-3:#1f3c5e;
    --line:rgba(140,174,214,.16);--line-strong:rgba(140,174,214,.32);
    --fg:#eaf1fb;--muted:#92a9c9;--muted-2:#6d86a6;
    --accent:#1668e3;--accent-bright:#3b8bff;--accent-soft:rgba(22,104,227,.16);
    --gold:#d8ab52;--gold-soft:rgba(216,171,82,.15);
    --good:#32c08a;--warn:#e7b24a;--crit:#e5674f;--crit-soft:rgba(229,103,79,.14);
    --radius:16px;--radius-sm:11px;--shadow:0 18px 40px -22px rgba(0,0,0,.8);
    --page-grad:radial-gradient(1200px 520px at 82% -8%,rgba(22,104,227,.18),transparent 60%),radial-gradient(900px 440px at 4% 2%,rgba(216,171,82,.07),transparent 55%);
    --font-display:"Bricolage Grotesque",-apple-system,system-ui,sans-serif;
    --font-body:"Manrope",-apple-system,system-ui,sans-serif;
    --font-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#eaeff7;--bg-2:#ffffff;--surface:#ffffff;--surface-2:#f2f6fc;--surface-3:#e5ebf5;
    --line:rgba(24,46,78,.12);--line-strong:rgba(24,46,78,.22);
    --fg:#0d1f36;--muted:#53688a;--muted-2:#7d90ab;
    --accent:#1668e3;--accent-bright:#1457c0;--accent-soft:rgba(22,104,227,.12);
    --gold:#a67c2e;--gold-soft:rgba(176,132,47,.16);
    --good:#1a9c6b;--warn:#b9811a;--crit:#cf4a34;--crit-soft:rgba(207,74,52,.12);
    --shadow:0 16px 34px -20px rgba(24,46,78,.4);
    --page-grad:radial-gradient(1200px 520px at 82% -8%,rgba(22,104,227,.10),transparent 60%),radial-gradient(900px 440px at 4% 2%,rgba(176,132,47,.07),transparent 55%);
    color-scheme:light;
  }
  /* a few spots use literal light-on-dark colors — fix them for the light theme */
  :root[data-theme="light"] .pill.recur{color:#4b45b0}
  :root[data-theme="light"] .shift-chip.night{color:#4b45b0;background:rgba(99,102,241,.12);border-color:rgba(99,102,241,.3)}
  :root[data-theme="light"] .pill.p-high,:root[data-theme="light"] .pill.due.overdue,:root[data-theme="light"] .m-due.overdue{color:#c0392b}
  :root[data-theme="light"] .m-recur{color:#4b45b0}
  :root[data-theme="light"] .focus{border:1px solid var(--line-strong)}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--page-grad),var(--bg);color:var(--fg);font-family:var(--font-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit;color:inherit;cursor:pointer}
  input,textarea,select{font-family:inherit}
  h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
  img{max-width:100%}
  [hidden]{display:none!important}
  ::selection{background:rgba(59,139,255,.35)}

  .wrap{max-width:1320px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 160px;position:relative;z-index:2}

  /* command bar */
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .brand{display:flex;align-items:center;gap:11px;margin-right:auto}
  .brand .mark{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent-bright),var(--accent));font-family:var(--font-display);font-weight:800;font-size:20px;color:#fff;box-shadow:0 6px 18px -6px rgba(22,104,227,.75)}
  .brand b{font-family:var(--font-display);font-weight:800;font-size:17px;letter-spacing:-.02em;display:block;line-height:1.1}
  .brand span{color:var(--muted);font-size:11.5px;letter-spacing:.14em;text-transform:uppercase}
  .clocks{display:flex;gap:10px;flex-wrap:wrap}
  .clock{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:7px 13px;min-width:112px}
  .clock .city{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);display:flex;justify-content:space-between;gap:8px}
  .clock .city em{font-style:normal;color:var(--accent-bright)}
  .clock .time{font-family:var(--font-mono);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin-top:2px}
  .clock .time small{font-size:12px;color:var(--muted);font-weight:500}
  .focus{display:flex;align-items:center;gap:12px;background:linear-gradient(130deg,#f4f6fb,#e7ebf3);border-radius:999px;padding:7px 10px 7px 18px;color:#0c1d31;box-shadow:var(--shadow)}
  .focus .lbl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:#5a6b82;font-weight:700}
  .focus .fdisp{font-family:var(--font-mono);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums;letter-spacing:.02em;min-width:76px;text-align:center}
  .focus .fdisp.run{color:var(--accent)}
  .iconbtn{width:42px;height:42px;border-radius:50%;border:none;display:grid;place-items:center;background:var(--accent);color:#fff;font-size:17px;transition:transform .12s,background .15s}
  .iconbtn:hover{transform:scale(1.06)}.iconbtn.ghost{background:#0c1d31}.iconbtn:active{transform:scale(.95)}
  .presets{display:flex;gap:4px}
  .presets button{border:none;background:transparent;color:#5a6b82;font-weight:700;font-size:13px;padding:6px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
  .presets button.on{background:var(--accent);color:#fff}
  .presets .unit{align-self:center;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:#8294ab}
  #themeToggle{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;display:grid;place-items:center;transition:border-color .15s,transform .1s}
  #themeToggle:hover{border-color:var(--line-strong)}
  #themeToggle:active{transform:scale(.92)}
  .profbtn{display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 14px 5px 6px;transition:border-color .15s}
  .profbtn:hover{border-color:var(--line-strong)}
  .profbtn .av{width:34px;height:34px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:15px;letter-spacing:-2px}
  .profbtn .pn{font-weight:700;font-size:13px;line-height:1.15}
  .profbtn .ps{font-size:11px;color:var(--gold);display:flex;align-items:center;gap:3px}

  /* goal */
  .goal{background:linear-gradient(135deg,var(--surface),var(--bg-2));border:1px solid var(--line);border-radius:var(--radius);padding:13px 16px;margin-bottom:14px}
  .goal-head{display:flex;align-items:center;gap:10px;margin-bottom:4px}
  .goal-head h2{font-size:16px}
  .eyebrow{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-bright);font-weight:700}
  .goal-empty p{color:var(--muted);max-width:60ch;margin:6px 0 14px}
  .btn{border:none;border-radius:10px;padding:10px 16px;font-weight:700;font-size:13px;background:var(--accent);color:#fff;transition:filter .15s,transform .1s}
  .btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(1px)}
  .btn.sm{padding:7px 12px;font-size:12px}
  .btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
  .btn.gold{background:linear-gradient(135deg,var(--gold),#c3923a);color:#2a1e06}
  .btn.danger{background:transparent;border:1px solid var(--crit);color:var(--crit)}
  .btn.danger:hover{background:var(--crit-soft)}
  .btn.block{width:100%;justify-content:center;padding:12px}
  .btn[disabled]{opacity:.55;cursor:default}
  .gtitle{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:8px}
  .gtitle h2{font-size:16px}
  .gtitle .meta{color:var(--muted);font-size:12px;margin-left:auto}
  .gtitle .meta b{color:var(--fg)}
  .track{position:relative;height:50px;margin:2px 4px 6px}
  .track .rail{position:absolute;left:0;right:0;top:31px;height:5px;border-radius:3px;background:var(--surface-3);overflow:hidden}
  .track .rail i{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-bright));transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .track .runner{position:absolute;top:3px;transform:translateX(-50%);transition:left .6s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;align-items:center;gap:2px;z-index:3}
  .track .runner .bub{width:30px;height:30px;border-radius:50%;background:#fff;color:#0c1d31;display:grid;place-items:center;font-size:15px;box-shadow:0 5px 13px -4px rgba(0,0,0,.6);border:2px solid var(--accent-bright)}
  .track .runner .cap{font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .track .finish{position:absolute;right:-4px;top:17px;font-size:21px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.5))}
  .track .chest{position:absolute;top:20px;transform:translateX(-50%);font-size:17px;transition:transform .2s;filter:grayscale(.7) brightness(.8)}
  .track .chest.open{filter:none;transform:translateX(-50%) scale(1.15)}
  .track .dates{position:absolute;left:0;right:0;top:40px;display:flex;justify-content:space-between;color:var(--muted-2);font-size:10px;font-variant-numeric:tabular-nums}
  .rewards{display:flex;gap:7px;flex-wrap:wrap}
  .reward{display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:11.5px}
  .reward.open{border-color:var(--gold);background:var(--gold-soft);color:var(--gold)}
  .reward .pct{font-weight:700;font-variant-numeric:tabular-nums}

  /* board */
  .board-head{display:flex;align-items:center;gap:10px;margin:4px 2px 12px;flex-wrap:wrap}
  .board-head h2{font-size:15px}
  .board-head .hint{color:var(--muted-2);font-size:11.5px;margin-left:auto}
  .tabs{display:inline-flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
  .tabs button{border:none;background:transparent;color:var(--muted);font-weight:700;font-size:13px;padding:7px 14px;border-radius:9px;display:inline-flex;align-items:center;gap:6px;transition:background .15s,color .15s}
  .tabs button.on{background:var(--accent);color:#fff}
  .tab-count{font-size:11px;font-weight:700;background:rgba(255,255,255,.22);padding:1px 7px;border-radius:999px;min-width:18px;text-align:center}
  .tabs button:not(.on) .tab-count{background:var(--surface-3);color:var(--muted)}
  .pill.recur{background:rgba(99,102,241,.16);color:#b4bcff}
  .recur-head{font-family:var(--font-display);font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:7px;flex:1;min-width:0}
  .board{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 18px;scroll-snap-type:x proximity}
  .board::-webkit-scrollbar{height:9px}.board::-webkit-scrollbar-thumb{background:var(--surface-3);border-radius:9px}
  .col{flex:0 0 286px;scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:9px;align-self:flex-start;max-height:70vh}
  .col-head{display:flex;align-items:center;gap:6px}
  .col-head input{flex:1;min-width:0;background:transparent;border:none;color:var(--fg);font-family:var(--font-display);font-weight:700;font-size:14.5px;padding:3px 2px;border-radius:6px}
  .col-head input:focus{outline:none;background:var(--surface-2)}
  .col-count{font-size:11px;color:var(--muted-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .col-head .mini{width:24px;height:24px;border-radius:7px;border:none;background:transparent;color:var(--muted);font-size:13px;display:grid;place-items:center}
  .col-head .mini:hover{background:var(--surface-2);color:var(--fg)}
  .cards{display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:2px 2px 2px 0}
  .card{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 11px 10px 13px;display:flex;flex-direction:column;gap:7px;transition:border-color .15s;box-shadow:inset 3px 0 0 var(--pc,transparent)}
  .card[data-prio="high"]{--pc:var(--crit)}
  .card[data-prio="med"]{--pc:var(--gold)}
  .card[data-prio="low"]{--pc:var(--good)}
  .card:hover{border-color:var(--line-strong)}
  .card.done{opacity:.55}
  .card-top{display:flex;gap:9px;align-items:flex-start}
  .chk{flex:0 0 auto;width:22px;height:22px;border-radius:7px;border:2px solid var(--line-strong);background:transparent;display:grid;place-items:center;font-size:13px;color:#fff;margin-top:1px;transition:background .15s,border-color .15s}
  .chk.on{background:var(--good);border-color:var(--good)}
  .card .ttl{flex:1;min-width:0;font-weight:600;font-size:13.5px;line-height:1.35;cursor:pointer;word-break:break-word}
  .card.done .ttl{text-decoration:line-through;text-decoration-color:var(--muted-2)}
  /* compact meta line: due · recur · project … avatar */
  /* fixed 2x2 slots: project | deadline  /  recurrence | assignee */
  .card-meta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;align-items:center;font-size:11px;color:var(--muted);line-height:1.2}
  .card-meta:empty{display:none}
  .m-item{display:inline-flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;color:var(--muted);font-weight:500}
  .m-item .ic{flex:none;font-size:10.5px;line-height:1;opacity:.85}
  .m-item .t{overflow:hidden;text-overflow:ellipsis}
  .s-proj{grid-column:1;grid-row:1}
  .s-dl{grid-column:2;grid-row:1;justify-self:end}
  .s-recur{grid-column:1;grid-row:2}
  .s-name{grid-column:2;grid-row:2;justify-self:end;max-width:120px}
  .m-due.overdue{color:#ff8f78;font-weight:600}
  .m-due.today{color:var(--gold);font-weight:600}
  .avatar{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent-bright);font-size:9px;font-weight:800;display:grid;place-items:center;flex:0 0 auto}
  .dust-ctl{display:flex;align-items:center;gap:7px;margin-left:auto}
  .dust-ctl button{width:24px;height:24px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:15px;line-height:1;display:grid;place-items:center}
  .dust-ctl button:hover{border-color:var(--line-strong)}
  .dust-ctl .n{font-weight:700;font-variant-numeric:tabular-nums;min-width:34px;text-align:center;display:flex;align-items:center;gap:2px;justify-content:center}
  .dust-ctl .du{font-size:11px;opacity:.8}
  .addtask,.addcol{border:1px dashed var(--line-strong);background:transparent;color:var(--muted);border-radius:var(--radius-sm);padding:10px;font-weight:600;font-size:13px;text-align:left;transition:color .15s,border-color .15s}
  .addtask:hover,.addcol:hover{color:var(--fg);border-color:var(--accent)}
  .addcol{flex:0 0 200px;align-self:flex-start;text-align:center;padding:16px}
  .card:hover{transform:translateY(-1px)}
  .card{cursor:grab}
  .card:active{cursor:grabbing}
  .card.dragging{opacity:.4;cursor:grabbing}
  .drop-line{height:3px;border-radius:2px;background:var(--accent-bright);box-shadow:0 0 8px -1px var(--accent-bright);flex:0 0 auto}
  .chk:active{transform:scale(.88)}
  .col.weekly{border-color:rgba(216,171,82,.45);box-shadow:0 0 0 1px rgba(216,171,82,.16) inset,var(--shadow)}
  .col-head .mini.on{background:var(--gold-soft);color:var(--gold)}
  .weekly-tag{font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold);background:var(--gold-soft);border:1px solid rgba(216,171,82,.3);border-radius:7px;padding:4px 9px;font-weight:700;align-self:flex-start;display:inline-flex;align-items:center;gap:5px}
  .shift-chip{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line)}
  .shift-chip.night{background:rgba(99,102,241,.16);border-color:rgba(129,140,248,.4);color:#b4bcff}
  .shift-chip.day{background:rgba(231,178,74,.14);border-color:rgba(231,178,74,.4);color:var(--gold)}
  .crew .shiftdot{margin-left:auto;font-size:13px}
  .crew-sub{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-top:6px}

  /* dust layer */
  .dust-layer{position:fixed;left:0;right:0;bottom:0;height:150px;pointer-events:none;z-index:1;overflow:hidden}
  .dustbunny{position:absolute;bottom:14px;width:30px;height:24px;will-change:transform}
  .dustbunny .body{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 34%,#5a6b82,#33465f 70%);box-shadow:inset -2px -3px 4px rgba(0,0,0,.4)}
  .dustbunny .body::before,.dustbunny .body::after{content:"";position:absolute;top:34%;width:5px;height:5px;border-radius:50%;background:#eaf1fb}
  .dustbunny .body::before{left:30%}.dustbunny .body::after{left:55%}
  .dustbunny .eye1,.dustbunny .eye2{position:absolute;top:calc(34% + 1.5px);width:2.5px;height:2.5px;border-radius:50%;background:#081423}
  .dustbunny .eye1{left:calc(30% + 1px)}.dustbunny .eye2{left:calc(55% + 1px)}
  .dust-count{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:2;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--muted);pointer-events:none}
  .dust-count b{color:var(--fg)}
  /* Mascot — Sweepy the duck (own on-top layer, pinned to the bottom edge) */
  .mascot{position:fixed;left:0;bottom:calc(6px + env(safe-area-inset-bottom,0px));width:92px;height:72px;z-index:6;pointer-events:none;will-change:transform}
  .mascot .duck-flip{width:100%;height:100%}
  .mascot.flip .duck-flip{transform:scaleX(-1)}
  .mascot .duck{width:100%;height:100%;display:block;transform-origin:center bottom;animation:waddle .6s ease-in-out infinite}
  @keyframes waddle{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-2px)}}
  .mascot .say{position:absolute;bottom:64px;left:50%;transform:translateX(-50%) translateY(4px) scale(.85);transform-origin:bottom center;background:#fff;color:#0c1d31;font-weight:700;font-size:11px;padding:5px 11px;border-radius:12px;white-space:nowrap;opacity:0;transition:opacity .2s,transform .2s;box-shadow:0 8px 18px -8px rgba(0,0,0,.6)}
  .mascot .say::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);border:5px solid transparent;border-top-color:#fff}
  .mascot .say.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}

  /* overlays */
  .scrim{position:fixed;inset:0;background:rgba(4,10,18,.72);backdrop-filter:blur(3px);z-index:40;display:grid;place-items:start center;overflow-y:auto;padding:max(24px,env(safe-area-inset-top,0px)) 16px 40px}
  .sheet{width:100%;max-width:520px;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow);margin-top:24px;overflow:hidden}
  .sheet.wide{max-width:600px}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:18px 20px 12px}
  .sheet-head h2{font-size:18px;flex:1}
  .sheet-body{padding:4px 20px 20px;display:flex;flex-direction:column;gap:16px}
  .x{width:32px;height:32px;border-radius:9px;border:none;background:var(--surface-2);color:var(--muted);font-size:16px;display:grid;place-items:center}
  .x:hover{color:var(--fg)}
  .field{display:flex;flex-direction:column;gap:6px}
  .field>label{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .in{background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--fg);font-size:14px;width:100%}
  .in:focus{outline:none;border-color:var(--accent)}
  textarea.in{resize:vertical;min-height:62px;line-height:1.5}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{border:1px solid var(--line);background:var(--bg-2);color:var(--muted);border-radius:9px;padding:8px 13px;font-weight:600;font-size:12.5px}
  .seg button.on{border-color:var(--accent);background:var(--accent-soft);color:var(--fg)}
  .dustbox,.timerbox{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:14px}
  .dustbox .hd,.timerbox .hd{display:flex;align-items:center;gap:8px;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:10px}
  .dustrow{display:flex;align-items:center;gap:10px}
  .dustrow .big{font-family:var(--font-mono);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;min-width:42px;text-align:center}
  .dustrow button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);color:var(--fg);font-size:20px;line-height:1}
  .dustbox p,.timerbox p{color:var(--muted-2);font-size:11.5px;margin:9px 0 0;line-height:1.45}
  .tdisp{font-family:var(--font-mono);font-weight:700;font-size:32px;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .tdisp.run{color:var(--accent-bright)}
  .tctl{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .tctl .in{flex:1;min-width:80px}

  /* profile */
  .streakbars{display:flex;gap:5px;flex-wrap:wrap}
  .sb{width:30px;height:16px;border-radius:5px;background:var(--surface-3)}
  .sb.on{background:linear-gradient(135deg,var(--gold),#c3923a)}
  .emoji-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
  .emoji-grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg-2);border-radius:10px;font-size:19px;display:grid;place-items:center;transition:border-color .12s}
  .emoji-grid button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
  .emoji-pick{display:flex;flex-wrap:wrap;gap:6px}
  .emoji-pick button{width:38px;height:38px;border:1px solid var(--line);background:var(--bg-2);border-radius:9px;font-size:18px;display:grid;place-items:center;transition:border-color .12s}
  .emoji-pick button.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent) inset}
  .chkline{display:flex;align-items:flex-start;gap:10px;cursor:pointer;font-size:13px}
  .chkline .box{flex:0 0 auto;width:20px;height:20px;border-radius:6px;border:2px solid var(--line-strong);display:grid;place-items:center;font-size:12px;color:#fff;margin-top:1px}
  .chkline .box.on{background:var(--accent);border-color:var(--accent)}
  .chkline small{color:var(--muted-2);display:block;font-size:11.5px}
  .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:9px}
  .ach{background:var(--bg-2);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px;opacity:.5;transition:opacity .2s}
  .ach.on{opacity:1;border-color:var(--gold);background:linear-gradient(145deg,var(--gold-soft),transparent)}
  .ach .ic{font-size:22px}.ach .an{font-weight:700;font-size:12.5px}
  .ach .ad{font-size:10.5px;color:var(--muted-2);line-height:1.35}
  .ach.on .an{color:var(--gold)}
  .section-cap{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
  .crew{display:flex;flex-direction:column;gap:7px}
  .crew .row{display:flex;align-items:center;gap:9px;font-size:13px}
  .crew .av{width:30px;height:30px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;font-size:13px;letter-spacing:-2px}
  .crew .nm{font-weight:600}.crew .st{color:var(--muted-2);font-size:11.5px}
  .crew .fire{margin-left:auto;color:var(--gold);font-size:12px;font-weight:700}
  .crew .row{padding:3px 0}
  .crew .toss-n{color:var(--muted-2);font-size:11px;font-weight:700;margin-left:2px}
  .crew-actions{display:inline-flex;gap:4px;margin-left:auto}
  .crew-actions button{width:28px;height:28px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);font-size:14px;display:grid;place-items:center;transition:border-color .12s,transform .1s}
  .crew-actions button:hover{border-color:var(--accent)}
  .crew-actions button:active{transform:scale(.9)}
  /* task reactions */
  .rx-row{display:flex;gap:5px;flex-wrap:wrap;align-items:center;min-height:20px}
  .rx-add{opacity:0;transition:opacity .12s}
  .card:hover .rx-add,.rx-add:focus-visible{opacity:.7}
  .rx-row:hover .rx-add{opacity:1}
  .rx{display:inline-flex;align-items:center;gap:4px;background:var(--surface-3);border:1px solid var(--line);border-radius:999px;padding:2px 8px;font-size:12px;font-weight:700;cursor:pointer;transition:border-color .12s,background .12s}
  .rx.mine{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-bright)}
  .rx .c{font-variant-numeric:tabular-nums}
  .rx-add{width:24px;height:24px;border-radius:999px;border:1px dashed var(--line-strong);background:transparent;color:var(--muted);font-size:13px;display:grid;place-items:center}
  .rx-add:hover{color:var(--fg);border-color:var(--accent)}
  .rx-pop{display:flex;gap:4px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:6px;box-shadow:var(--shadow)}
  .rx-pop button{width:30px;height:30px;border-radius:8px;border:none;background:transparent;font-size:17px}
  .rx-pop button:hover{background:var(--surface-2)}
  .rx-pop.pass-pop{flex-direction:column;gap:2px;padding:8px;max-width:280px;align-items:stretch}
  .pass-h{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:2px 6px 6px}
  .pass-item{width:auto!important;height:auto!important;text-align:left;font-size:13px!important;font-weight:600;color:var(--fg);padding:8px 10px!important;border-radius:9px!important;display:flex;align-items:center;gap:8px;justify-content:space-between}
  .pass-dust{color:var(--muted-2);font-size:11px;font-weight:700;white-space:nowrap}
  /* flying nudge emoji */
  .nudge-fly{position:fixed;z-index:70;font-size:34px;pointer-events:none;will-change:transform,opacity}
  @keyframes flyacross{0%{transform:translate(0,0) rotate(0);opacity:0}8%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
  /* Sweepy's sweep-up burst on task completion */
  .sweep-fx{position:fixed;z-index:69;font-size:20px;pointer-events:none;will-change:transform,opacity}
  @keyframes sweeppop{0%{transform:translate(0,0) scale(.4);opacity:0}25%{opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1);opacity:0}}
  .mascot.scrub .duck{animation:scrub .5s ease}
  @keyframes scrub{0%,100%{transform:translateY(0) rotate(-2deg)}30%{transform:translateY(-7px) rotate(-7deg)}65%{transform:translateY(0) rotate(6deg)}}

  .toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(140%);z-index:60;background:var(--surface-3);border:1px solid var(--gold);color:var(--fg);padding:11px 20px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.9,.3,1.2);display:flex;align-items:center;gap:8px}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* auth */
  .auth{min-height:100%;display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-left,0px)) 40px}
  .auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--line-strong);border-radius:20px;box-shadow:var(--shadow);padding:26px 24px}
  .auth-brand{display:flex;align-items:center;gap:11px;margin-bottom:18px}
  .auth-brand .mark{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent-bright),var(--accent));font-family:var(--font-display);font-weight:800;font-size:22px;color:#fff}
  .auth-brand b{font-family:var(--font-display);font-weight:800;font-size:18px;display:block;line-height:1.1}
  .auth-brand span{color:var(--muted);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
  .auth h1{font-size:21px;margin-bottom:4px}
  .auth .sub{color:var(--muted);font-size:13px;margin-bottom:18px}
  .auth form{display:flex;flex-direction:column;gap:12px}
  .auth .err{background:var(--crit-soft);border:1px solid var(--crit);color:#ffb3a3;border-radius:9px;padding:9px 12px;font-size:12.5px}
  .auth .switch{text-align:center;color:var(--muted);font-size:12.5px;margin-top:14px}
  .auth .switch button{background:none;border:none;color:var(--accent-bright);font-weight:700;padding:0;font-size:12.5px}

  @media (max-width:640px){
    .focus{order:5;width:100%;justify-content:space-between}
    .brand{width:100%}.profbtn{order:4}
    .row2{grid-template-columns:1fr}.wrap{padding-block:14px 150px}
  }
  @media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}
</style>
</head>
<body>

<!-- AUTH SCREEN -->
<div class="auth" id="authScreen" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="mark">AT</div>
      <div><b>ANEON</b><span>Internal team tracker</span></div>
    </div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="sub" id="authSub">Sign in to your crew board.</p>
    <div class="err" id="authErr" hidden></div>
    <form id="authForm">
      <div class="field" id="nameField" hidden>
        <label for="aName">Your name</label>
        <input class="in" id="aName" autocomplete="name" placeholder="How the crew sees you">
      </div>
      <div class="field">
        <label for="aEmail">Email</label>
        <input class="in" id="aEmail" type="email" autocomplete="email" placeholder="you@hotel.com" required>
      </div>
      <div class="field">
        <label for="aPass">Password</label>
        <input class="in" id="aPass" type="password" autocomplete="current-password" placeholder="At least 8 characters" required>
      </div>
      <button class="btn block" id="authSubmit" type="submit">Sign in</button>
    </form>
    <div class="switch" id="authSwitch"></div>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="wrap">
    <header class="topbar">
      <div class="brand">
        <div class="mark">AT</div>
        <div><b>ANEON</b><span>Internal team tracker</span></div>
      </div>
      <div class="clocks" id="clocks"></div>
      <div class="focus">
        <div><div class="lbl">Focus timer</div><div class="fdisp" id="focusDisp">25:00</div></div>
        <button class="iconbtn" id="focusToggle" title="Start / pause" aria-label="Start or pause">▶</button>
        <button class="iconbtn ghost" id="focusReset" title="Reset" aria-label="Reset">↺</button>
        <div class="presets" id="focusPresets">
          <button data-min="15">15</button>
          <button data-min="25" class="on">25</button>
          <button data-min="50">50</button>
          <span class="unit">min</span>
        </div>
      </div>
      <button id="themeToggle" title="Switch theme" aria-label="Switch light or dark theme">☀️</button>
      <button class="profbtn" id="profBtn" aria-label="Open your profile">
        <span class="av" id="profAv">🧹</span>
        <span><span class="pn" id="profName">You</span><span class="ps" id="profStreakWrap"><span id="profStreak">0</span>-day streak 🔥</span></span>
        <span class="shift-chip" id="profShift" hidden></span>
      </button>
    </header>
    <section id="goalWrap" style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px"></section>
    <div class="board-head">
      <div class="tabs" id="viewTabs">
        <button data-view="board" class="on">🗂️ Shift board</button>
        <button data-view="projects">📁 Projects <span class="tab-count" id="projCount"></span></button>
        <button data-view="recurring">🔁 Recurring <span class="tab-count" id="recurCount"></span></button>
      </div>
      <span class="hint" id="boardHint">Finishing a task sweeps its dust away • everyone sees the same board live</span>
    </div>
    <div class="board" id="board"></div>
  </div>
  <div class="dust-layer" id="dustLayer" aria-hidden="true"></div>
  <div class="dust-count" id="dustCount"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="scrim" id="scrim" hidden></div>

<script>
"use strict";
(function(){
  const $ = s => document.querySelector(s);
  const esc = s => String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const fmt = s => String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

  /* ---------- theme (dark / light) ---------- */
  let theme="dark"; try{ const s=localStorage.getItem("hcb-theme"); if(s==="light"||s==="dark") theme=s; }catch(e){}
  function applyTheme(t){
    const root=document.documentElement;
    if(t==="light") root.setAttribute("data-theme","light"); else root.removeAttribute("data-theme");
    const b=$("#themeToggle"); if(b) b.textContent=(t==="light")?"🌙":"☀️";
  }
  applyTheme(theme);
  (function wireTheme(){ const b=$("#themeToggle"); if(b) b.onclick=()=>{ theme=(theme==="light")?"dark":"light"; try{localStorage.setItem("hcb-theme",theme);}catch(e){} applyTheme(theme); }; })();

  /* ---------- api ---------- */
  async function api(method, url, body){
    const opt = { method, headers:{}, credentials:"same-origin" };
    if(body!==undefined){ opt.headers["Content-Type"]="application/json"; opt.body=JSON.stringify(body); }
    const r = await fetch(url, opt);
    let data=null; try{ data=await r.json(); }catch(e){}
    if(!r.ok){ const err=new Error((data&&data.error)||("Request failed ("+r.status+")")); err.status=r.status; throw err; }
    return data;
  }

  /* ---------- state ---------- */
  let state = { me:null, columns:[], recurring:[], goals:[], users:[] };
  let view="board"; try{ const v=localStorage.getItem("hcb-view"); if(["board","recurring","projects"].includes(v)) view=v; }catch(e){}
  const RECUR_LABEL={day:"Daily",week:"Weekly",month:"Monthly",quarter:"Quarterly"};
  const WEEKDAYS=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const ordinal=n=>{ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
  function recurBadge(t){
    if(!t.recur) return "";
    let suf="";
    if(t.recur==="week" && t.recurAnchor!=null) suf=" "+WEEKDAYS[((t.recurAnchor%7)+7)%7];
    else if((t.recur==="month"||t.recur==="quarter") && t.recurAnchor!=null) suf=" "+(t.recurAnchor===0?"last":ordinal(t.recurAnchor));
    return `<span class="m-item m-recur s-recur" title="Repeats"><span class="ic">🔁</span>${RECUR_LABEL[t.recur]||"Repeats"}${suf}</span>`;
  }
  const RECUR_META=[
    {key:"day",name:"Daily",note:"Resets every day",ic:"☀️"},
    {key:"week",name:"Weekly",note:"Resets every Monday",ic:"📅"},
    {key:"month",name:"Monthly",note:"Resets on the 1st",ic:"🗓️"},
    {key:"quarter",name:"Quarterly",note:"Resets each quarter",ic:"📈"}
  ];
  let loadTimer=null, es=null;

  /* ---------- auth screen ---------- */
  let mode="login";
  function showAuth(){ $("#app").hidden=true; $("#authScreen").hidden=false; teardownApp(); renderAuthMode(); }
  function renderAuthMode(){
    const signup = mode==="signup";
    $("#authTitle").textContent = signup ? "Create your account" : "Welcome back";
    $("#authSub").textContent   = signup ? "Join your crew board — takes a few seconds." : "Sign in to your crew board.";
    $("#nameField").hidden = !signup;
    $("#aName").required = signup;
    $("#authSubmit").textContent = signup ? "Create account" : "Sign in";
    $("#aPass").autocomplete = signup ? "new-password" : "current-password";
    $("#authSwitch").innerHTML = signup
      ? `Already have an account? <button type="button" id="toLogin">Sign in</button>`
      : `New here? <button type="button" id="toSignup">Create an account</button>`;
    const sw=$("#"+(signup?"toLogin":"toSignup")); if(sw) sw.onclick=()=>{ mode=signup?"login":"signup"; hideErr(); renderAuthMode(); };
    hideErr();
  }
  function showErr(m){ const e=$("#authErr"); e.textContent=m; e.hidden=false; }
  function hideErr(){ $("#authErr").hidden=true; }
  $("#authForm").addEventListener("submit", async e=>{
    e.preventDefault(); hideErr();
    const btn=$("#authSubmit"); btn.disabled=true;
    try{
      const payload={ email:$("#aEmail").value.trim(), password:$("#aPass").value };
      if(mode==="signup") payload.name=$("#aName").value.trim();
      const res = await api("POST", "/api/auth/"+(mode==="signup"?"signup":"login"), payload);
      state.me=res.user; enterApp();
    }catch(err){ showErr(err.message); }
    finally{ btn.disabled=false; }
  });

  /* ---------- boot ---------- */
  async function boot(){
    try{ const r=await api("GET","/api/me"); state.me=r.user; enterApp(); }
    catch(err){ showAuth(); }
  }

  function enterApp(){
    $("#authScreen").hidden=true; $("#app").hidden=false;
    startClocks(); initFocus();
    loadBoard();
    connectSSE();
    startDust();
  }
  function teardownApp(){
    if(es){ es.close(); es=null; }
    stopFocusTick(); stopClocks();
  }

  /* ---------- SSE live sync ---------- */
  function connectSSE(){
    if(es) es.close();
    try{
      es=new EventSource("/api/events");
      es.onmessage=()=>scheduleLoad();
      es.addEventListener("nudge",e=>{ try{ handleNudge(JSON.parse(e.data)); }catch(_){} });
      es.onerror=()=>{/* browser auto-retries */};
    }catch(e){}
  }
  /* someone tossed/high-fived/poked/passed-a-chore at me */
  function handleNudge(p){
    const who=esc(p.fromName||"Someone");
    let msg;
    if(p.kind==="chore") msg=`${p.emoji||"💩"} ${who} passed you a chore: ${esc(p.text||"a task")}`;
    else if(p.kind==="highfive") msg=`🙌 ${who} high-fived you!`;
    else if(p.kind==="poke") msg=`👈 ${who} poked you!`;
    else msg=`${p.emoji||"💩"} ${who} tossed ${p.emoji||"💩"} at you!`;
    toast(msg);
    flingEmoji(p.emoji||(p.kind==="highfive"?"🙌":p.kind==="poke"?"👈":"💩"), p.kind==="chore"?5:4);
  }
  function flingEmoji(emoji,n){
    const W=window.innerWidth||800, H=window.innerHeight||600;
    for(let i=0;i<n;i++){
      const el=document.createElement("div"); el.className="nudge-fly"; el.textContent=emoji;
      const startX=Math.random()*W, startY=H+40;
      el.style.left=startX+"px"; el.style.top=startY+"px";
      el.style.setProperty("--dx",((Math.random()-0.5)*W*0.6).toFixed(0)+"px");
      el.style.setProperty("--dy",(-(H*0.55)-Math.random()*H*0.3).toFixed(0)+"px");
      el.style.setProperty("--rot",((Math.random()-0.5)*720).toFixed(0)+"deg");
      el.style.animation=`flyacross ${(1.1+Math.random()*0.7).toFixed(2)}s cubic-bezier(.3,.7,.4,1) forwards`;
      el.style.animationDelay=(i*0.08)+"s";
      document.body.appendChild(el);
      setTimeout(()=>el.remove(),2400);
    }
  }
  function sendNudge(toUserId,kind,emoji){ api("POST","/api/nudge",{toUserId,kind,emoji}).catch(()=>{}); }
  function scheduleLoad(){ clearTimeout(loadTimer); loadTimer=setTimeout(loadBoard,150); }

  async function loadBoard(){
    try{
      const d=await api("GET","/api/board");
      state.me=d.me; state.columns=d.columns; state.recurring=d.recurring||[]; state.goals=d.goals||[]; state.users=d.users;
      renderProfile(); renderGoals(); renderBoard(); syncDust();
    }catch(err){ if(err.status===401) showAuth(); }
  }

  /* ---------- world clocks ---------- */
  const CITIES=[{name:"McLean HQ",tz:"America/New_York"},{name:"London",tz:"Europe/London"},{name:"Dubai",tz:"Asia/Dubai"},{name:"Riyadh",tz:"Asia/Riyadh"},{name:"Egypt",tz:"Africa/Cairo"}];
  let clockInt=null;
  function offsetLabel(tz){ try{ const p=new Intl.DateTimeFormat("en-US",{timeZone:tz,timeZoneName:"shortOffset"}).formatToParts(new Date()); const o=p.find(x=>x.type==="timeZoneName"); return o?o.value.replace("GMT","UTC"):""; }catch(e){ return ""; } }
  function startClocks(){
    $("#clocks").innerHTML=CITIES.map((c,i)=>`<div class="clock"><div class="city"><span>${c.name}</span><em>${offsetLabel(c.tz)}</em></div><div class="time" id="clk${i}">--:--</div></div>`).join("");
    tickClocks(); clockInt=setInterval(tickClocks,1000);
  }
  function stopClocks(){ clearInterval(clockInt); clockInt=null; }
  function tickClocks(){
    CITIES.forEach((c,i)=>{ const el=document.getElementById("clk"+i); if(!el)return;
      const now=new Date();
      const hm=new Intl.DateTimeFormat("en-GB",{timeZone:c.tz,hour:"2-digit",minute:"2-digit",hour12:false}).format(now);
      const ss=new Intl.DateTimeFormat("en-GB",{timeZone:c.tz,second:"2-digit"}).format(now);
      el.innerHTML=`${hm}<small>:${ss}</small>`;
    });
  }

  /* ---------- focus timer (per-device) ---------- */
  let focus={minutes:25,remaining:1500,running:false}, focusInt=null;
  function loadFocusPref(){ try{ const m=+localStorage.getItem("hcb-focus-min"); if(m>0){ focus.minutes=m; focus.remaining=m*60; } }catch(e){} }
  function initFocus(){ loadFocusPref(); renderFocus();
    $("#focusToggle").onclick=()=> focus.running?stopFocusTick():startFocusTick();
    $("#focusReset").onclick=()=>{ stopFocusTick(); focus.remaining=focus.minutes*60; renderFocus(); };
    $("#focusPresets").onclick=e=>{ const b=e.target.closest("button[data-min]"); if(!b)return; stopFocusTick(); focus.minutes=+b.dataset.min; focus.remaining=focus.minutes*60; try{localStorage.setItem("hcb-focus-min",focus.minutes);}catch(e2){} renderFocus(); };
  }
  function renderFocus(){ const d=$("#focusDisp"); if(!d)return; d.textContent=fmt(focus.remaining); d.classList.toggle("run",focus.running);
    $("#focusToggle").textContent=focus.running?"❚❚":"▶";
    document.querySelectorAll("#focusPresets button").forEach(b=>b.classList.toggle("on",+b.dataset.min===focus.minutes)); }
  function startFocusTick(){ if(focusInt)return; focus.running=true; renderFocus();
    focusInt=setInterval(()=>{ if(focus.remaining<=0){ stopFocusTick(); toast("⏱️ Focus block done — take a breather"); return;} focus.remaining--; renderFocus(); },1000); }
  function stopFocusTick(){ focus.running=false; clearInterval(focusInt); focusInt=null; renderFocus(); }

  /* ---------- goal ---------- */
  function fmtDate(iso){ try{ return new Date(iso).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }catch(e){ return iso; } }
  function dueMeta(iso){ if(!iso) return null; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return null; const today=new Date(); today.setHours(0,0,0,0); const diff=Math.round((d-today)/864e5); return {label:d.toLocaleDateString("en-US",{month:"short",day:"numeric"}),diff}; }
  function goalPanelHtml(g,single){
    const chests=(g.rewards||[]).filter(r=>r.label&&r.label.trim()).map(r=>({...r,open:g.pct>=r.pct}));
    return `<div class="goal">
      <div class="goal-head"><span class="eyebrow">Road to the goal</span>
        <button class="btn ghost sm" data-editgoal="${g.id}" style="margin-left:auto">Edit</button></div>
      <div class="gtitle"><h2>${esc(g.title||"Goal")}</h2>
        <span class="meta"><b>${g.done}</b> of <b>${g.total}</b> linked tasks done · <b>${g.total-g.done}</b> to go</span></div>
      <div class="track">
        <div class="rail"><i style="width:${g.pct}%"></i></div>
        ${chests.map(c=>`<div class="chest ${c.open?"open":""}" style="left:${c.pct}%" title="${esc(c.label)} · ${c.pct}%">${c.open?"🎁":"🔒"}</div>`).join("")}
        <div class="runner" style="left:${g.pct}%"><div class="bub">${esc(g.team_emoji||"🛎️")}</div><span class="cap">us</span></div>
        <div class="finish">${esc(g.finish_emoji||"🏆")}</div>
        <div class="dates"><span>${fmtDate(g.start)}</span><span>${fmtDate(g.deadline)}</span></div>
      </div>
      <div class="rewards">${chests.length?chests.map(c=>`<span class="reward ${c.open?"open":""}"><span class="pct">${c.open?"🎁":"🔒"} ${c.pct}%</span> · ${esc(c.label)}</span>`).join(""):`<span class="reward">No reward chests yet — add some when you edit the goal</span>`}</div>
    </div>`;
  }
  function renderGoals(){
    const el=$("#goalWrap"), goals=state.goals||[];
    if(goals.length===0){
      el.innerHTML=`<div class="goal"><div class="goal-head"><span class="eyebrow">Road to the goal</span></div>
        <div class="goal-empty"><h2>Set a shared goal</h2>
        <p>Give the crew a goal with a deadline. Your team marker travels the timeline toward the finish as linked tasks get closed — and reward chests unlock along the way. You can run several goals at once.</p>
        <button class="btn" data-newgoal>Set a goal</button></div></div>`;
    } else {
      el.innerHTML=goals.map(g=>goalPanelHtml(g)).join("")
        +`<button class="addtask" data-newgoal style="align-self:flex-start">+ Add another goal</button>`;
    }
    el.querySelectorAll("[data-newgoal]").forEach(b=>b.onclick=()=>openGoal());
    el.querySelectorAll("[data-editgoal]").forEach(b=>b.onclick=()=>openGoal(b.dataset.editgoal));
  }

  /* ---------- board ---------- */
  function userName(id){ const u=state.users.find(x=>x.id===id); return u?u.name:""; }
  function boardTasks(){ return state.columns.flatMap(c=>c.tasks); }
  function renderBoard(){
    const rc=(state.recurring||[]).length;
    const rcEl=$("#recurCount"); if(rcEl) rcEl.textContent=rc?rc:"";
    const projCount=new Set(boardTasks().map(t=>(t.project||"").trim()).filter(Boolean)).size;
    const pcEl=$("#projCount"); if(pcEl) pcEl.textContent=projCount?projCount:"";
    document.querySelectorAll("#viewTabs button").forEach(b=>b.classList.toggle("on",b.dataset.view===view));
    const hint=$("#boardHint");
    if(hint) hint.textContent = view==="recurring" ? "Recurring tasks auto-uncheck when their cycle rolls over"
      : view==="projects" ? "Your tasks grouped by project • drag a card to another project to re-file it"
      : "Finishing a task sweeps its dust away • everyone sees the same board live";
    if(view==="recurring") renderRecurringBoard();
    else if(view==="projects") renderProjectsBoard();
    else renderShiftBoard();
  }
  function renderProjectsBoard(){
    const b=$("#board"); b.innerHTML="";
    const groups=new Map();
    boardTasks().forEach(t=>{ const name=(t.project||"").trim()||"No project"; if(!groups.has(name)) groups.set(name,[]); groups.get(name).push(t); });
    const names=[...groups.keys()].filter(n=>n!=="No project").sort((a,b)=>a.localeCompare(b));
    if(groups.has("No project")) names.push("No project");
    if(!names.length){
      b.innerHTML=`<div class="col" style="flex:0 0 320px"><div class="goal-empty" style="padding:6px 4px"><h2 style="font-size:16px;margin-bottom:4px">No projects yet</h2><p style="font-size:12.5px">Open a task, set its <b>Project / area</b>, and it'll show up grouped here.</p></div></div>`;
      return;
    }
    names.forEach(name=>{
      const list=groups.get(name), done=list.filter(t=>t.done).length;
      const projVal=name==="No project"?"":name;
      const el=document.createElement("div"); el.className="col";
      el.innerHTML=`<div class="col-head" style="cursor:default"><span class="recur-head">📁 ${esc(name)}</span><span class="col-count">${done}/${list.length}</span></div>
        <div class="cards" data-cards-project="${esc(projVal)}"></div>`;
      const cards=el.querySelector(".cards"); list.forEach(t=>cards.appendChild(taskCard(t)));
      b.appendChild(el);
    });
  }
  function renderShiftBoard(){
    const b=$("#board"); b.innerHTML="";
    state.columns.forEach((col,ci)=>{
      const done=col.tasks.filter(t=>t.done).length;
      const el=document.createElement("div"); el.className="col";
      el.innerHTML=`<div class="col-head">
          <input value="${esc(col.name)}" data-col="${col.id}" aria-label="List name">
          <span class="col-count">${done}/${col.tasks.length}</span>
          <button class="mini" data-mv="l" data-col="${col.id}" title="Move left" ${ci===0?"disabled style=opacity:.3":""}>←</button>
          <button class="mini" data-mv="r" data-col="${col.id}" title="Move right" ${ci===state.columns.length-1?"disabled style=opacity:.3":""}>→</button>
          <button class="mini" data-delcol="${col.id}" title="Delete list">✕</button>
        </div>
        <div class="cards" data-cards-col="${col.id}"></div>
        <button class="addtask" data-addtask="${col.id}">+ New task</button>`;
      const cards=el.querySelector(".cards");
      col.tasks.forEach(t=>cards.appendChild(taskCard(t)));
      b.appendChild(el);
    });
    const add=document.createElement("button"); add.className="addcol"; add.textContent="+ Add list";
    add.onclick=()=>mutate(()=>api("POST","/api/columns",{name:"New list"}));
    b.appendChild(add);
  }
  function renderRecurringBoard(){
    const b=$("#board"); b.innerHTML="";
    RECUR_META.forEach(rm=>{
      const list=(state.recurring||[]).filter(t=>t.recur===rm.key);
      const done=list.filter(t=>t.done).length;
      const el=document.createElement("div"); el.className="col recur-col";
      el.innerHTML=`<div class="col-head" style="cursor:default">
          <span class="recur-head">${rm.ic} ${rm.name}</span>
          <span class="col-count">${done}/${list.length}</span>
        </div>
        <div class="weekly-tag">🔁 ${rm.note}</div>
        <div class="cards" data-cards-recur="${rm.key}"></div>
        <button class="addtask" data-addrecur="${rm.key}">+ New ${rm.name.toLowerCase()} task</button>`;
      const cards=el.querySelector(".cards");
      list.forEach(t=>cards.appendChild(taskCard(t)));
      b.appendChild(el);
    });
  }
  document.getElementById("viewTabs").addEventListener("click",e=>{
    const btn=e.target.closest("button[data-view]"); if(!btn) return;
    view=btn.dataset.view; try{ localStorage.setItem("hcb-view",view); }catch(e2){}
    renderBoard();
  });
  function initialsOf(name){ return name.trim().split(/\s+/).map(w=>w[0]||"").join("").replace(/[^\p{L}\p{N}]/gu,"").slice(0,2).toUpperCase(); }
  function taskCard(t){
    const el=document.createElement("div"); el.className="card"+(t.done?" done":"");
    el.draggable=true; el.dataset.card=t.id; el.dataset.prio=t.priority||"med";
    el.title=(t.priority==="high"?"High":t.priority==="low"?"Low":"Medium")+" priority";
    const who=t.assigneeId?userName(t.assigneeId):"";
    const dm=dueMeta(t.dueDate);
    const dueM=dm?`<span class="m-item m-due s-dl ${(!t.done&&dm.diff<0)?"overdue":dm.diff===0?"today":""}" title="Deadline"><span class="ic">📅</span>${dm.diff===0?"Today":esc(dm.label)}</span>`:"";
    const projM=t.project?`<span class="m-item m-proj s-proj" title="Project: ${esc(t.project)}"><span class="ic">📁</span><span class="t">${esc(t.project)}</span></span>`:"";
    const firstName=who?who.trim().split(/\s+/)[0]:"";
    const nameM=who?`<span class="m-item s-name" title="Assigned to ${esc(who)}"><span class="avatar">${esc(initialsOf(who))}</span><span class="t">${esc(firstName)}</span></span>`:"";
    const metaInner=projM+dueM+recurBadge(t)+nameM;
    const metaRow=metaInner?`<div class="card-meta">${metaInner}</div>`:"";
    el.innerHTML=`<div class="card-top">
        <button class="chk ${t.done?"on":""}" data-done="${t.id}" aria-label="Toggle done">${t.done?"✓":""}</button>
        <div class="ttl" data-open="${t.id}">${esc(t.title)||"Untitled task"}</div>
        <div class="dust-ctl">
          <button data-dust="-1" data-t="${t.id}" aria-label="Less dust">−</button>
          <span class="n" title="dust">${t.dust}<span class="du">🧹</span></span>
          <button data-dust="1" data-t="${t.id}" aria-label="More dust">+</button>
        </div></div>
      ${metaRow}
      <div class="rx-row">
        ${(t.reactions||[]).map(r=>`<span class="rx ${r.mine?"mine":""}" data-react="${t.id}" data-emoji="${r.emoji}">${r.emoji}<span class="c">${r.count}</span></span>`).join("")}
        <button class="rx-add" data-reactadd="${t.id}" aria-label="Add reaction">＋</button>
      </div>`;
    return el;
  }
  const REACTION_EMOJI=["👍","🔥","💩","🙌","😅","❤️","👀","🎉"];

  function findTask(id){ for(const c of state.columns){ const t=c.tasks.find(x=>x.id===id); if(t) return t; } return (state.recurring||[]).find(x=>x.id===id)||null; }

  /* mutate: optimistic-ish — call API, reload (SSE also reloads for others) */
  async function mutate(fn){ try{ await fn(); await loadBoard(); }catch(err){ if(err.status===401){ showAuth(); } else toast("⚠️ "+err.message); } }

  $("#board").addEventListener("click", e=>{
    let m;
    if((m=e.target.closest("[data-done]"))) toggleDone(m.dataset.done);
    else if((m=e.target.closest("[data-dust]"))) bumpDust(m.dataset.t,+m.dataset.dust);
    else if((m=e.target.closest("[data-open]"))) openTask(m.dataset.open);
    else if((m=e.target.closest("[data-addtask]"))) addTask(m.dataset.addtask);
    else if((m=e.target.closest("[data-mv]"))) mutate(()=>api("POST","/api/columns/"+m.dataset.col+"/move",{dir:m.dataset.mv}));
    else if((m=e.target.closest("[data-addrecur]"))) addRecurring(m.dataset.addrecur);
    else if((m=e.target.closest("[data-react]"))) react(m.dataset.react,m.dataset.emoji);
    else if((m=e.target.closest("[data-reactadd]"))) openReactPop(m,m.dataset.reactadd);
    else if((m=e.target.closest("[data-delcol]"))) mutate(()=>api("DELETE","/api/columns/"+m.dataset.delcol));
  });
  function react(taskId,emoji){ mutate(()=>api("POST","/api/tasks/"+taskId+"/react",{emoji})); }
  function openReactPop(anchor,taskId){
    closeReactPop();
    const pop=document.createElement("div"); pop.className="rx-pop"; pop.id="rxPop";
    pop.innerHTML=REACTION_EMOJI.map(e=>`<button data-e="${e}">${e}</button>`).join("");
    document.body.appendChild(pop);
    const r=anchor.getBoundingClientRect();
    pop.style.position="fixed";
    pop.style.left=Math.min(r.left, (window.innerWidth||800)-pop.offsetWidth-12)+"px";
    pop.style.top=(r.bottom+6)+"px"; pop.style.zIndex=50;
    pop.onclick=ev=>{ const b=ev.target.closest("button[data-e]"); if(!b) return; closeReactPop(); react(taskId,b.dataset.e); };
    setTimeout(()=>document.addEventListener("mousedown",closeReactPopOutside),0);
  }
  function closeReactPop(){ const p=$("#rxPop"); if(p) p.remove(); document.removeEventListener("mousedown",closeReactPopOutside); }
  function closeReactPopOutside(ev){ if(!ev.target.closest("#rxPop")) closeReactPop(); }
  // Pass a chore straight from the crew card: pick one of your open tasks to dump on them.
  function openPassPicker(anchor,toUserId,toName){
    closeReactPop();
    const open=[...state.columns.flatMap(c=>c.tasks),...(state.recurring||[])].filter(t=>!t.done);
    const meId=state.me&&state.me.id;
    let list=open.filter(t=>t.assigneeId===meId);      // your own open chores first
    if(!list.length) list=open;                         // otherwise any open task
    if(!list.length){ toast("No open chores to pass 🎉"); return; }
    const pop=document.createElement("div"); pop.className="rx-pop pass-pop"; pop.id="rxPop";
    pop.innerHTML=`<div class="pass-h">Pass a chore to ${esc(toName||"them")} 💩</div>`
      +list.slice(0,10).map(t=>`<button class="pass-item" data-tid="${t.id}">${esc(t.title)||"Untitled task"} <span class="pass-dust">${t.dust}🧹</span></button>`).join("");
    document.body.appendChild(pop);
    const r=anchor.getBoundingClientRect();
    pop.style.position="fixed"; pop.style.zIndex=50;
    pop.style.left=Math.max(12,Math.min(r.right-pop.offsetWidth, (window.innerWidth||800)-pop.offsetWidth-12))+"px";
    pop.style.top=(r.bottom+6)+"px";
    pop.onclick=ev=>{ const b=ev.target.closest("button[data-tid]"); if(!b) return; closeReactPop(); mutate(()=>api("POST","/api/tasks/"+b.dataset.tid+"/pass",{toUserId})); toast("💩 Chore passed!"); };
    setTimeout(()=>document.addEventListener("mousedown",closeReactPopOutside),0);
  }
  $("#board").addEventListener("change", e=>{
    const inp=e.target.closest("input[data-col]");
    if(inp) mutate(()=>api("PATCH","/api/columns/"+inp.dataset.col,{name:inp.value}));
  });

  /* ---------- drag & drop task cards ---------- */
  let draggingId=null, lastCont=null;
  const board=$("#board");
  function cardsIndexAt(cont,y){
    const cards=[...cont.querySelectorAll(".card:not(.dragging)")];
    for(let i=0;i<cards.length;i++){ const r=cards[i].getBoundingClientRect(); if(y < r.top + r.height/2) return i; }
    return cards.length;
  }
  function showDropLine(cont,idx){
    let line=document.getElementById("dropLine");
    if(!line){ line=document.createElement("div"); line.id="dropLine"; line.className="drop-line"; }
    const cards=[...cont.querySelectorAll(".card:not(.dragging)")];
    if(idx>=cards.length) cont.appendChild(line); else cont.insertBefore(line,cards[idx]);
  }
  function removeDropLine(){ const l=document.getElementById("dropLine"); if(l) l.remove(); }
  function cleanupDrag(){ const d=board.querySelector(".card.dragging"); if(d) d.classList.remove("dragging"); removeDropLine(); draggingId=null; lastCont=null; }
  board.addEventListener("dragstart", e=>{
    const c=e.target.closest("[data-card]"); if(!c) return;
    draggingId=c.dataset.card; setTimeout(()=>c.classList.add("dragging"),0);
    try{ e.dataTransfer.setData("text/plain",draggingId); e.dataTransfer.effectAllowed="move"; }catch(_){}
  });
  board.addEventListener("dragover", e=>{
    if(!draggingId) return;
    const cont=e.target.closest(".cards"); if(!cont) return;
    e.preventDefault(); try{ e.dataTransfer.dropEffect="move"; }catch(_){}
    lastCont=cont; showDropLine(cont, cardsIndexAt(cont,e.clientY));
  });
  board.addEventListener("drop", e=>{
    if(!draggingId) return;
    const cont=e.target.closest(".cards")||lastCont; const id=draggingId;
    if(!cont){ cleanupDrag(); return; }
    e.preventDefault();
    const idx=cardsIndexAt(cont,e.clientY);
    cleanupDrag();
    if(cont.dataset.cardsCol){
      mutate(()=>api("POST","/api/tasks/"+id+"/move",{columnId:cont.dataset.cardsCol,index:idx}));
    } else if(cont.dataset.cardsRecur){
      const t=findTask(id);
      if(t && t.recur!==cont.dataset.cardsRecur) mutate(()=>api("PATCH","/api/tasks/"+id,{recur:cont.dataset.cardsRecur}));
    } else if("cardsProject" in cont.dataset){
      const t=findTask(id), np=cont.dataset.cardsProject;
      if(t && (t.project||"")!==np) mutate(()=>api("PATCH","/api/tasks/"+id,{project:np}));
    }
  });
  board.addEventListener("dragend", cleanupDrag);

  async function toggleDone(id){
    const t=findTask(id); if(!t) return;
    try{
      const r=await api("POST","/api/tasks/"+id+"/toggle");
      if(r.done){ mascotSay(SWEEP_LINES[Math.floor(Math.random()*SWEEP_LINES.length)]); sweepCelebrate(); }
      if(r.unlocked&&r.unlocked.length) toast(`🏅 Achievement: ${r.unlocked[0].name}`);
      await loadBoard();
    }catch(err){ if(err.status===401) showAuth(); else toast("⚠️ "+err.message); }
  }
  function bumpDust(id,d){ const t=findTask(id); if(!t)return; const nd=Math.max(0,t.dust+d);
    mutate(()=>api("PATCH","/api/tasks/"+id,{dust:nd})); }
  function addTask(colId){ mutate(async()=>{ const r=await api("POST","/api/columns/"+colId+"/tasks"); pendingOpen=r.id; }); }
  function addRecurring(recur){ mutate(async()=>{ const r=await api("POST","/api/recurring",{recur}); pendingOpen=r.id; }); }
  let pendingOpen=null;
  const _loadBoard=loadBoard;
  loadBoard=async function(){ await _loadBoard(); if(pendingOpen){ const id=pendingOpen; pendingOpen=null; openTask(id,true); } };

  /* ---------- task editor ---------- */
  function openTask(id,isNew){
    const t=findTask(id); if(!t) return;
    const goalOpts = (state.goals||[]).map(g=>`<option value="${g.id}" ${t.goalId===g.id?"selected":""}>${esc(g.title)}</option>`).join("");
    const teamOpts = `<option value="">Unassigned</option>`+state.users.map(u=>`<option value="${u.id}" ${t.assigneeId===u.id?"selected":""}>${esc(u.name)}</option>`).join("");

    openSheet(`<div class="sheet wide" role="dialog" aria-modal="true" aria-label="Task">
      <div class="sheet-head"><h2>${isNew?"New task":"Task"}</h2><button class="x" data-close aria-label="Close">✕</button></div>
      <div class="sheet-body">
        <div class="field"><label for="tTitle">Title</label><input class="in" id="tTitle" value="${esc(t.title)}" placeholder="What needs doing?"></div>
        <div class="field"><label for="tDesc">Notes</label><textarea class="in" id="tDesc" placeholder="Details, steps, links…">${esc(t.notes)}</textarea></div>
        <div class="row2">
          <div class="field"><label>Priority</label><div class="seg" id="tPrio">
            <button data-v="low" class="${t.priority==="low"?"on":""}">Low</button>
            <button data-v="med" class="${t.priority==="med"?"on":""}">Medium</button>
            <button data-v="high" class="${t.priority==="high"?"on":""}">High</button></div></div>
          <div class="field"><label for="tDue">Due date</label><input class="in" id="tDue" type="date" value="${esc(t.dueDate||'')}"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="tProj">Project / area</label><input class="in" id="tProj" value="${esc(t.project)}" placeholder="e.g. Housekeeping"></div>
          <div class="field"><label for="tWho">Assignee</label><select class="in" id="tWho">${teamOpts}</select></div>
        </div>
        ${otherOpts?`<div class="field"><label>Pass this chore <span style="color:var(--muted-2);text-transform:none;letter-spacing:0">— reassign it and dump the 💩 on a teammate (they get pinged)</span></label>
          <div style="display:flex;gap:8px"><select class="in" id="tPassTo"><option value="">Pick a teammate…</option>${otherOpts}</select>
          <button class="btn ghost sm" id="tPass" type="button" style="white-space:nowrap">Pass 💩</button></div></div>`:""}
        <div class="field"><label>Repeat <span style="color:var(--muted-2);text-transform:none;letter-spacing:0">— it auto-unchecks each cycle</span></label>
          <div class="seg" id="tRecur">

            <button data-v="week" class="${t.recur==="week"?"on":""}">Weekly</button>
            <button data-v="month" class="${t.recur==="month"?"on":""}">Monthly</button>

          </div>
          <div id="tAnchorWrap" style="margin-top:8px" hidden>
            <label id="tAnchorLabel" style="font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700;display:block;margin-bottom:5px">On</label>
            <select class="in" id="tAnchor" style="max-width:240px"></select>
          </div>
        </div>
        <div class="field"><label for="tGoal">Counts toward goal</label><select class="in" id="tGoal"><option value="">— none —</option>${goalOpts}</select></div>
        <div class="dustbox"><div class="hd">🧹 Dust <span style="color:var(--muted-2);text-transform:none;letter-spacing:0;font-weight:500">— how much of a grind this is</span></div>
          <div class="dustrow"><button id="tDustDown" aria-label="Less">−</button><span class="big" id="tDustN">${t.dust}</span><button id="tDustUp" aria-label="More">+</button></div>
          <p>Dust bunnies pile up at the bottom of the board. Finish the task and its dust gets swept away.</p></div>

  function syncDust(){

      b.innerHTML='<div class="body"></div><span class="eye1"></span><span class="eye2"></span>';

      b.style.opacity=0.55+Math.random()*0.4; dustLayer.appendChild(b); bunnies.push(b); }
    while(bunnies.length>want){ const b=bunnies.pop(); b.remove(); }

  function startDust(){ if(dustRAF) return; buildMascot(); t0=performance.now(); dustRAF=requestAnimationFrame(animDust); }

  /* ---------- Sweepy the duck (mascot) ---------- */
  const DUCK_SVG=`<div class="say"></div><div class="duck-flip"><svg class="duck" viewBox="0 0 92 72" xmlns="http://www.w3.org/2000/svg">

      <path d="M74 60 L88 60 L85 71 L77 71 Z" fill="#E7B24A"/>
      <line x1="79" y1="61.5" x2="79" y2="70" stroke="#b98a30" stroke-width="1"/>

    </g>
  </svg></div>`;
  let mascotX=14, mascotDir=1, mascotEl=null, idleSaid=false, everDusty=false, dashTarget=null;
  function buildMascot(){
    if(mascotEl) return;
    mascotEl=document.createElement("div");
    mascotEl.id="mascot"; mascotEl.className="mascot"; mascotEl.setAttribute("aria-hidden","true");
    mascotEl.innerHTML=DUCK_SVG;
    document.body.appendChild(mascotEl);
  }
  function updateMascot(dt,w){
    if(!mascotEl) return;
    const duckW=92, maxX=Math.max(14,(w||window.innerWidth||800)-duckW-8);
    if(dashTarget!=null){                    // scurrying to a just-finished task's dust
      const diff=dashTarget-mascotX;
      mascotDir=diff<0?-1:1;
      const step=Math.sign(diff)*Math.min(Math.abs(diff), dt*0.22);
      mascotX+=step;
      if(Math.abs(dashTarget-mascotX)<6) dashTarget=null;
    } else {
      const clean=openDustTotal()===0;
      const speed=clean?0.015:0.04;          // slows down when there's nothing to sweep
      mascotX += mascotDir*dt*speed;
      if(mascotX>maxX){ mascotX=maxX; mascotDir=-1; }
      if(mascotX<14){ mascotX=14; mascotDir=1; }
      if(!clean){ everDusty=true; idleSaid=false; }
      if(clean && everDusty && !idleSaid){ idleSaid=true; mascotSay("Spotless! ✨"); }
    }
    mascotX=Math.max(14,Math.min(maxX,mascotX));
    mascotEl.style.transform=`translateX(${mascotX}px)`;
    mascotEl.classList.toggle("flip", mascotDir<0);
  }
  // Called when a task is completed: Sweepy scurries to the nearest dust bunny and sweeps it up.
  function sweepCelebrate(){
    if(!mascotEl) return;
    const w=window.innerWidth||800;
    if(bunnies.length){
      let bestX=null,bestD=1e9;
      for(const b of bunnies){ const bx=parseFloat(b.dataset.x)/100*w; const d=Math.abs(bx-mascotX); if(d<bestD){ bestD=d; bestX=bx; } }
      if(bestX!=null) dashTarget=Math.max(14,Math.min(w-100,bestX-26));
    }
    setTimeout(sweepBurst,430);
    mascotEl.classList.add("scrub"); setTimeout(()=>mascotEl.classList.remove("scrub"),650);
  }
  function sweepBurst(){
    const originX=mascotX+46, originY=(window.innerHeight||600)-54;
    ["✨","✨","✨","💨","💨","🫧"].forEach((em,i)=>{
      const el=document.createElement("div"); el.className="sweep-fx"; el.textContent=em;
      el.style.left=originX+"px"; el.style.top=originY+"px";
      el.style.setProperty("--dx",((Math.random()-0.5)*130).toFixed(0)+"px");
      el.style.setProperty("--dy",(-28-Math.random()*62).toFixed(0)+"px");
      el.style.animation=`sweeppop ${(0.7+Math.random()*0.5).toFixed(2)}s ease-out forwards`;
      el.style.animationDelay=(i*0.04)+"s";
      document.body.appendChild(el); setTimeout(()=>el.remove(),1500);
    });
  }
  let sayT=null;
  function mascotSay(text){
    const s=mascotEl&&mascotEl.querySelector(".say"); if(!s) return;
    s.textContent=text; s.classList.add("show");
    clearTimeout(sayT); sayT=setTimeout(()=>s.classList.remove("show"),2200);
  }
  const SWEEP_LINES=["Swept! 🧹","Nice one!","One less mess!","Quack-tastic!","Tidy!","On a roll!"];

  /* ---------- overlays + toast ---------- */
  const scrim=$("#scrim");
  function openSheet(html){ scrim.innerHTML=html; scrim.hidden=false; document.body.style.overflow="hidden";
    scrim.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet); }
  function closeSheet(){ scrim.hidden=true; scrim.innerHTML=""; document.body.style.overflow=""; }
  scrim.addEventListener("mousedown",e=>{ if(e.target===scrim) closeSheet(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!scrim.hidden) closeSheet(); });

  let toastT=null;
  function toast(msg){ const el=$("#toast"); el.textContent=msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2800); }

  boot();
})();
</script>
