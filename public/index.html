<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пласт Інвест — супровід тендерів</title>
<style>
  :root{
    --bg:#0a0f1a; --panel:#0f1727; --panel-2:#13203a; --card:#14223c; --card-2:#17284a;
    --line:#223354; --line-2:#2c4168; --fg:#eef3fb; --muted:#9db0cf; --muted-2:#6c81a6;
    --accent:#3b7bf6; --accent-2:#6aa0ff; --accent-soft:#16305e;
    --good:#45c586; --good-soft:#0f2a1d; --warn:#eab54a; --warn-soft:#2a230f; --bad:#ff7a66; --bad-soft:#2c1512;
    --radius:16px; --radius-sm:11px; --shadow:0 20px 50px -24px rgba(0,0,0,.75);
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --mono:ui-monospace,Menlo,monospace;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{background:
      radial-gradient(1100px 520px at 90% -10%,#1b2b52 0%,transparent 55%),
      radial-gradient(820px 460px at 0% 106%,#2c2010 0%,transparent 52%),
      radial-gradient(700px 500px at 50% 120%,#1a1030 0%,transparent 55%),
      var(--bg);
       color:var(--fg);font-family:var(--font);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;cursor:pointer}
  a{color:var(--accent-2)}
  .in{width:100%;background:#0c1322;border:1px solid var(--line);border-radius:10px;color:var(--fg);
      font:inherit;font-size:14px;padding:9px 11px;outline:none}
  .in:focus{border-color:var(--accent)}
  textarea.in{resize:vertical;min-height:58px}
  select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
    background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:30px}
  label{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted-2);font-weight:700;margin-bottom:5px}
  .btn{background:linear-gradient(135deg,var(--accent-2),var(--accent));border:none;color:#fff;font-weight:700;font-size:14px;padding:10px 15px;border-radius:10px;transition:filter .15s;box-shadow:0 6px 18px -8px var(--accent)}
  .btn:hover{filter:brightness(1.08)}
  .btn:disabled{opacity:.6}
  .btn.block{width:100%}
  .btn.ghost{background:var(--panel-2);border:1px solid var(--line);color:var(--fg)}
  .btn.sm{padding:7px 12px;font-size:13px}
  .btn.danger{background:var(--bad-soft);border:1px solid #5e2a30;color:#ffb3a7}
  .mut{color:var(--muted)} .mut2{color:var(--muted-2)}

  /* ---- auth ---- */
  .auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px}
  .auth[hidden]{display:none}
  .auth-card{width:100%;max-width:430px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:28px;box-shadow:var(--shadow)}
  .logo{display:flex;align-items:center;gap:12px}
  .logo .slot{width:46px;height:46px;border-radius:13px;display:grid;place-items:center;font-weight:800;color:#fff;
       background:linear-gradient(150deg,var(--accent-2),var(--accent));font-size:18px;flex:none}
  .logo b{font-weight:800;font-size:17px;display:block;line-height:1.05}
  .logo span{color:var(--muted);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
  .auth h1{font-size:20px;margin:20px 0 4px} .auth .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
  .field{margin-bottom:13px}
  .err{background:#241319;border:1px solid #5e2a30;color:#ffb3a7;font-size:13px;padding:10px 12px;border-radius:10px;margin-bottom:13px}
  .switch{text-align:center;color:var(--muted);font-size:13px;margin-top:15px}
  .switch button{background:none;border:none;color:var(--accent-2);font-weight:700;padding:0}
  .switch .sep{margin:0 8px;color:var(--line-2)}

  /* ---- shell ---- */
  .topbar{position:sticky;top:0;z-index:30;background:rgba(10,15,26,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
  .topbar-in{max-width:1480px;margin:0 auto;display:flex;align-items:center;gap:16px;padding:12px max(16px,env(safe-area-inset-left,0))}
  .logo-slot{display:flex;align-items:center;gap:12px}
  .logo-box{width:46px;height:46px;border-radius:13px;flex:none;display:grid;place-items:center;overflow:hidden;
       background:linear-gradient(150deg,var(--accent-2),var(--accent));border:1px solid var(--line-2);position:relative}
  .logo-box b{font-weight:800;color:#fff;font-size:18px}
  .logo-box img{width:100%;height:100%;object-fit:cover}
  .logo-box .hintup{position:absolute;inset:0;display:grid;place-items:center;font-size:9px;color:#fff;background:rgba(0,0,0,.45);opacity:0;transition:opacity .15s}
  .logo-box:hover .hintup{opacity:1;cursor:pointer}
  .appname b{font-weight:800;font-size:16px;display:block;line-height:1.05}
  .appname span{color:var(--muted-2);font-size:10px;letter-spacing:.16em;text-transform:uppercase}
  .nav{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
  .nav button{border:none;background:none;color:var(--muted);font-weight:700;font-size:13.5px;padding:8px 14px;border-radius:9px}
  .nav button.on{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff}
  .spacer{flex:1 1 auto}
  .clock{text-align:right;line-height:1.25}
  .clock .t{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px}
  .clock .d{color:var(--muted-2);font-size:11.5px}
  .profbtn{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 13px 5px 5px;color:var(--fg);font-weight:600;font-size:13.5px}
  .av{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent-2);display:grid;place-items:center;font-weight:800;font-size:12px;flex:none}
  .wrap{max-width:1480px;margin:0 auto;padding:22px max(16px,env(safe-area-inset-left,0)) 60px}

  .page-head{display:flex;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .page-head h2{font-size:20px;margin:0;position:relative;padding-left:14px}
  .page-head h2::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:5px;height:22px;border-radius:3px;background:linear-gradient(180deg,var(--warn),var(--accent))}
  .search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px;min-width:240px}
  .search input{background:none;border:none;color:var(--fg);outline:none;font:inherit;width:100%}

  /* ---- dashboard ---- */
  .counters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
  .counter{background:linear-gradient(170deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-top-width:3px;border-radius:var(--radius);padding:16px 18px}
  .counter .n{font-size:32px;font-weight:800;line-height:1}
  .counter .l{color:var(--muted);font-size:12.5px;margin-top:7px}
  .counter.red{border-color:#3a2420;border-top-color:var(--bad)} .counter.red .n{color:var(--bad)}
  .counter.amber{border-color:#3a3220;border-top-color:var(--warn)} .counter.amber .n{color:var(--warn)}
  .counter.blue{border-top-color:var(--accent-2)} .counter.blue .n{color:var(--accent-2)}
  .counter.green{border-color:#1c3b2b;border-top-color:var(--good)} .counter.green .n{color:var(--good)}

  .escal{background:var(--bad-soft);border:1px solid #5a2a26;color:#ffb3a7;border-radius:12px;padding:12px 16px;margin-bottom:16px;font-size:13.5px}
  .filterbar{display:flex;gap:12px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  .cust-head{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;margin-bottom:10px;padding-bottom:12px;border-bottom:1px solid var(--line)}
  .cust-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer}
  .cust-row:last-child{border-bottom:none} .cust-row:hover{color:var(--accent-2)}
  .tasklist{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .task.od{box-shadow:inset 3px 0 0 var(--bad)}
  .tasklist .th{padding:13px 18px;border-bottom:1px solid var(--line);font-weight:800;font-size:13px}
  .task{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);cursor:pointer}
  .task:last-child{border-bottom:none} .task:hover{background:var(--panel-2)}
  .task .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:16px;flex:none;background:var(--panel-2);border:1px solid var(--line)}
  .task .ic.k-sample{color:#2dd4bf;background:#0e2724;border-color:#1b4a46}
  .task .ic.k-production{color:#a78bfa;background:#191633;border-color:#352b63}
  .task .ic.k-shipment{color:#60a5fa;background:#0f1d3a;border-color:#23406e}
  .task .ic.k-document{color:#f0c56a;background:#271f0d;border-color:#4a3c1c}
  .task .ic.k-payment{color:#5fd39b;background:#0e2619;border-color:#1c4631}
  .task .ic.k-task{color:#f472b6;background:#2a1526;border-color:#4a2238}
  .rec-files{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:11px;padding-top:11px;border-top:1px dashed var(--line)}
  .rec-files .rf{display:inline-flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--fg)}
  .rec-files .rf-x{border:none;background:none;color:var(--muted-2);font-size:12px;padding:0 2px}
  .rec-files .rf-x:hover{color:var(--bad)}
  .rec-files .rf-add{display:inline-flex;align-items:center;gap:5px;cursor:pointer;color:var(--accent-2);font-weight:700;font-size:12.5px;border:1px dashed var(--line-2);border-radius:999px;padding:4px 11px}
  .cmt .meta{display:flex;gap:8px;align-items:center;margin-bottom:5px}
  .cmt .meta .who{font-weight:700;font-size:13px} .cmt .meta .when{color:var(--muted-2);font-size:11.5px}
  .task .main{flex:1;min-width:0}
  .task .main .t{font-weight:600}
  .task .main .s{color:var(--muted-2);font-size:12px;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .task .due{font-size:12px;color:var(--muted);text-align:right;white-space:nowrap}
  .badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
  .badge.red{color:var(--bad);border-color:#5a2a26;background:var(--bad-soft)}
  .badge.amber{color:var(--warn);border-color:#4a3c1c;background:var(--warn-soft)}

  /* ---- contracts list ---- */
  .clist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
  .ccard{background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:var(--radius);padding:16px 17px;cursor:pointer;transition:border-color .15s,transform .12s}
  .ccard:hover{border-color:var(--line-2);transform:translateY(-1px)}
  .ccard.warn{border-left-color:var(--warn)} .ccard.good{border-left-color:var(--good)}
  .ccard .buyer{font-weight:800;font-size:15.5px}
  .ccard .nos{color:var(--muted-2);font-size:12px;margin-top:2px}
  .ccard .rowm{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}
  .ccard .st{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;margin-top:11px;gap:10px}

  /* ---- detail ---- */
  .detail-head{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:16px}
  .back{background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--fg);width:38px;height:38px;font-size:16px;flex:none}
  .stats{display:flex;gap:10px;flex-wrap:wrap}
  .stat{background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:12px;padding:9px 14px;min-width:120px}
  .stat.s-sum{border-left-color:var(--accent-2)} .stat.s-paid{border-left-color:var(--good)} .stat.s-debt{border-left-color:var(--bad)}
  .stat .l{font-size:10.5px;color:var(--muted-2);text-transform:uppercase;letter-spacing:.06em}
  .stat .v{font-weight:800;font-size:16px;margin-top:2px}
  .stat .v.debt{color:var(--bad)} .stat .v.paid{color:var(--good)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
  .tabs button{border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;padding:8px 13px;border-radius:9px}
  .tabs button.on{background:linear-gradient(135deg,var(--accent-2),var(--accent));color:#fff}
  .tabs button .c{font-size:11px;opacity:.75;margin-left:4px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px}
  .rec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:15px;margin-bottom:13px}
  .rec:last-child{margin-bottom:0}
  .rec-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .rec-head .t{font-weight:800;font-size:14px;flex:1}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;font-size:13px;color:var(--muted);font-weight:600}
  .toggle .sw{width:40px;height:23px;border-radius:999px;background:#273a5e;position:relative;transition:background .15s;flex:none}
  .toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .15s}
  .toggle.on .sw{background:var(--good)} .toggle.on .sw::after{left:19px}
  .addbtn{border:1px dashed var(--line-2);background:none;color:var(--muted);border-radius:11px;padding:11px;font-weight:700;font-size:13.5px;width:100%}
  .addbtn:hover{color:var(--fg);border-color:var(--accent)}
  .sec-note{color:var(--muted-2);font-size:12.5px;margin:-4px 0 14px}

  .files{display:flex;flex-direction:column;gap:9px}
  .file-row{display:flex;align-items:center;gap:11px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
  .file-row .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .file-row .fs{color:var(--muted-2);font-size:12px;white-space:nowrap}

  /* ---- sheet + toast ---- */
  .scrim{position:fixed;inset:0;background:rgba(5,9,17,.68);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:24px 16px;overflow:auto}
  .scrim[hidden]{display:none}
  .sheet{width:100%;max-width:560px;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin:auto}
  .sheet-head{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
  .sheet-head h2{font-size:16px;margin:0;flex:1}
  .sheet-head .x{width:32px;height:32px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted)}
  .sheet-body{padding:18px;display:flex;flex-direction:column;gap:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .crew-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .crew-row:last-child{border-bottom:none}
  .section-cap{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted-2);font-weight:800;margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
  .toast:empty{display:none}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(calc(100% + 60px));z-index:70;background:var(--card-2);border:1px solid var(--accent);color:var(--fg);padding:11px 18px;border-radius:999px;font-weight:600;font-size:13px;box-shadow:var(--shadow);transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}
  .toast.show{transform:translateX(-50%) translateY(0)}
  .empty{color:var(--muted-2);text-align:center;padding:34px 16px}
  @media (max-width:820px){ .counters{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:760px){ .clock{display:none} .topbar-in{gap:10px;padding:10px 14px} .detail-head .stats{width:100%} }
  @media (max-width:560px){ .row2{grid-template-columns:1fr} .appname{display:none}
    .profbtn span:last-child{display:none} .profbtn{padding:4px} .nav button{padding:8px 11px}
    .page-head{gap:9px} .search{min-width:0;flex:1 1 100%;order:3} .wrap{padding-top:16px}
    .stat{flex:1 1 44%;min-width:0} .counter .n{font-size:27px} }
</style>
</head>
<body>

<!-- AUTH -->
<div class="auth" id="authScreen" hidden>
  <div class="auth-card">
    <div class="logo"><div class="slot" style="padding:0;overflow:hidden"><img src="/logo.png" alt="" style="width:100%;height:100%;object-fit:cover"></div><div><b>Пласт Інвест</b><span>Супровід тендерів</span></div></div>
    <h1 id="authTitle">З поверненням</h1>
    <p class="sub" id="authSub">Увійдіть, щоб відкрити свої договори.</p>
    <div class="err" id="authErr" hidden></div>
    <form id="authForm">
      <div class="field" id="nameField" hidden><label for="aName">Ваше ім'я</label>
        <input class="in" id="aName" autocomplete="name" placeholder="Як вас підписувати"></div>
      <div class="field"><label for="aEmail">Email</label>
        <input class="in" id="aEmail" type="email" autocomplete="email" placeholder="you@company.com" required></div>
      <div class="field"><label for="aPass">Пароль</label>
        <input class="in" id="aPass" type="password" autocomplete="current-password" placeholder="Щонайменше 8 символів" required></div>
      <button class="btn block" id="authSubmit" type="submit">Увійти</button>
    </form>
    <div class="switch" id="authSwitch"></div>
  </div>
</div>

<!-- APP -->
<div id="app" hidden>
  <div class="topbar"><div class="topbar-in">
    <div class="logo-slot">
      <div class="logo-box" id="logoBox" title="Натисніть, щоб змінити логотип"><img src="/logo.png" alt=""><span class="hintup">Змінити</span></div>
      <div class="appname"><b>Пласт Інвест</b><span>Супровід тендерів</span></div>
    </div>
    <div class="nav" id="nav">
      <button data-view="dashboard" class="on">Панель</button>
      <button data-view="contracts">Договори</button>
      <button data-view="customers">Замовники</button>
    </div>
    <div class="spacer"></div>
    <div class="clock"><div class="t" id="clockT">--:--:--</div><div class="d" id="clockD">—</div></div>
    <button class="profbtn" id="profBtn"><span class="av" id="profAv">?</span><span id="profName">—</span></button>
  </div></div>
  <div class="wrap" id="view"></div>
</div>

<input type="file" id="logoInput" accept="image/*" hidden>
<div class="scrim" id="scrim" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  "use strict";
  const $=s=>document.querySelector(s);
  const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
  const initials=n=>(n||"").trim().split(/\s+/).map(w=>w[0]||"").join("").replace(/[^\p{L}\p{N}]/gu,"").slice(0,2).toUpperCase()||"?";
  const money=n=>{ n=parseFloat(n)||0; return n.toLocaleString("uk-UA",{maximumFractionDigits:0})+" грн"; };
  const dateUA=iso=>{ if(!iso) return "—"; const d=new Date(iso+"T00:00:00"); if(isNaN(d)) return esc(iso);
    return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"short",year:"numeric"}); };
  const sizeKB=b=>b>=1048576?(b/1048576).toFixed(1)+" МБ":Math.max(1,Math.round(b/1024))+" КБ";
  const fmtDT=iso=>{ const d=new Date(iso); return isNaN(d)?"":d.toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"}); };
  const fmtQty=(n,u)=>(parseFloat(n)||0).toLocaleString("uk-UA")+(u?" "+u:"");

  async function api(method,url,body){
    const r=await fetch(url,{method,headers:body?{"Content-Type":"application/json"}:{},body:body?JSON.stringify(body):undefined});
    const ct=r.headers.get("content-type")||""; const data=ct.includes("json")?await r.json():null;
    if(!r.ok){ const e=new Error((data&&data.error)||("Помилка "+r.status)); e.status=r.status; throw e; }
    return data;
  }

  function renderCustomers(d){

  /* ---------- field specs ---------- */

  function field(child,id,spec,rec){
    const [key,label,type,span]=spec; const v=rec[camel(key)]; const sp=span===2?"grid-column:1/-1":"";
    const base=`data-child="${child}" data-id="${id}" data-f="${key}"`;
    if(type==="bool"){
      return `<div style="${sp}"><div class="toggle ${v?"on":""}" ${base} data-type="bool" role="button" tabindex="0">
        <span class="sw"></span><span>${esc(label)}</span></div></div>`;
    }
    let input;
    if(type==="textarea") input=`<textarea class="in" ${base}>${esc(v)}</textarea>`;
    else if(type==="user") input=`<select class="in" ${base}>${userOpts(v)}</select>`;
    else if(type==="number") input=`<input class="in" type="number" step="any" ${base} value="${esc(v)}">`;
    else if(type==="date") input=`<input class="in" type="date" ${base} value="${esc(v)}">`;
    else if(type&&type.startsWith("select:")){ const opts=type.slice(7).split(",");
      input=`<select class="in" ${base}>`+opts.map(o=>`<option ${o===v?"selected":""}>${esc(o)}</option>`).join("")+`</select>`; }
    else if(type&&type.startsWith("sselect:")){ const opts=type.slice(8).split(",").map(p=>p.split("="));
      input=`<select class="in" ${base}>`+opts.map(([val,lab])=>`<option value="${val}" ${val===v?"selected":""}>${esc(lab)}</option>`).join("")+`</select>`; }
    else input=`<input class="in" ${base} value="${esc(v)}">`;
    return `<div style="${sp}"><label>${esc(label)}</label>${input}</div>`;
  }
  const camel=k=>k.replace(/_([a-z])/g,(_,c)=>c.toUpperCase());

    if(child==="payments") return (rec.kind==="prepay"?"Передоплата":"Оплата")+(rec.amount?" · "+money(rec.amount):"");
    if(child==="documents") return rec.kind||"Документ";
    if(child==="production") return rec.product||"Продукція";
    if(child==="samples") return rec.description||"Зразок";
    if(child==="tasks") return rec.title||"Задача";
    return "Запис";

          <button class="btn danger sm" data-del="${child}" data-delid="${rec.id}">Видалити</button></div>
        <div class="grid">${F[child].map(sp=>field(child,rec.id,sp,rec)).join("")}</div>${files}</div>`;
    }).join("");
    return (items||`<div class="empty" style="padding:16px">Поки порожньо</div>`)
      +`<button class="addbtn" data-add="${child}">+ Додати запис</button>`;
  }

    } else if(tab==="files"){
      const files=d.attachments.map(a=>`<div class="file-row">
        <span>📎</span><a class="fn" href="/api/files/${a.id}" target="_blank">${esc(a.name)}</a>
        <span class="fs">${sizeKB(a.size)}</span>
        <button class="btn danger sm" data-delfile="${a.id}">✕</button></div>`).join("");
      body=`<div class="panel"><div class="sec-note">Скани договорів, специфікацій, ТТН, фото тощо. До 25 МБ на файл.</div>
        <div class="files" style="margin-bottom:14px">${files||`<div class="empty" style="padding:16px">Файлів ще немає</div>`}</div>
        <button class="addbtn" id="fileAdd">+ Завантажити файл</button>
        <input type="file" id="fileInput" multiple hidden></div>`;
    } else if(tab==="comments"){
      body=`<div class="panel">
        <div class="field"><textarea class="in" id="cmText" placeholder="Напишіть коментар для команди…"></textarea></div>
        <div><button class="btn sm" id="cmAdd">Додати коментар</button></div>
        <div style="margin-top:14px">${d.comments.map(x=>`<div class="rec cmt"><div class="meta"><span class="who">${esc(x.userName||"—")}</span><span class="when">${fmtDT(x.createdAt)}</span>${(x.userId===state.me.id||state.me.id===state.adminId)?`<span style="flex:1"></span><button class="btn danger sm" data-delcomment="${x.id}">✕</button>`:""}</div><div>${esc(x.text)}</div></div>`).join("")||`<div class="empty">Коментарів ще немає</div>`}</div></div>`;
    } else if(tab==="history"){
      body=`<div class="panel"><div class="sec-note">Усі зміни планових дат — хто і коли переносив строки.</div>
        ${d.history.map(h=>`<div class="rec" style="padding:12px 15px"><div style="display:flex;gap:10px;align-items:flex-start"><span>📅</span><div style="flex:1"><div><b>${esc(fieldLabel(h.scope,h.field))}</b>: <span class="mut2">${h.oldVal?dateUA(h.oldVal):"—"}</span> → <b>${h.newVal?dateUA(h.newVal):"—"}</b></div><div class="mut2" style="font-size:12px">${esc(h.userName||"")} · ${fmtDT(h.createdAt)}</div></div></div></div>`).join("")||`<div class="empty">Змін термінів ще не було</div>`}</div>`;
    } else {
      const notes={tasks:"Довільні доручення, яких немає серед стандартних блоків. Невиконані зʼявляються на панелі керівника.",
        samples:"Окремий блок — тут легко пропустити строки. Нагадування зʼявиться на панелі, якщо зразок не відправлено вчасно.",
        shipments:"Журнал відвантажень — один договір може мати кілька поставок.",
        documents:"Контроль по кожному документу: статус, дати та відповідальний.",
        payments:"Якщо договір оплачується частинами — додайте окремий запис на кожну оплату."}[tab];
      body=`<div class="panel">${notes?`<div class="sec-note">${notes}</div>`:""}${recordBlock(tab,d[tab],d.attachments)}</div>`;
    }
    $("#view").innerHTML=`
      <div class="detail-head">
        <button class="back" id="back">←</button>
        <div style="flex:1;min-width:200px">
          <h2 style="margin:0 0 3px">${esc(c.buyer)||"Без назви покупця"}</h2>
          <div class="mut2" style="font-size:13px">${c.tenderNo?"Тендер "+esc(c.tenderNo):""}${c.contractNo?" · Договір "+esc(c.contractNo):""}</div>
        </div>
        <div class="stats">
          <div class="stat s-sum"><div class="l">Сума договору</div><div class="v">${money(c.totalSum)}</div></div>
          <div class="stat s-paid"><div class="l">Оплачено</div><div class="v paid">${money(cm.paid)}</div></div>
          <div class="stat s-debt"><div class="l">Залишок боргу</div><div class="v ${cm.debt>0?"debt":""}">${money(cm.debt)}</div></div>
          ${cm.planQty>0?`<div class="stat"><div class="l">Залишок до поставки</div><div class="v">${fmtQty(cm.remainingQty,cm.unit)}</div></div>`:""}
          ${cm.overdueDebt>0?`<div class="stat s-debt"><div class="l">Прострочено оплат</div><div class="v debt">${money(cm.overdueDebt)}</div></div>`:""}
        </div>
      </div>
      <div class="tabs" id="tabs">${tabs}</div>
      ${body}`;
    $("#back").onclick=()=>go("contracts");
    $("#tabs").querySelectorAll("button[data-tab]").forEach(b=>b.onclick=()=>{ state.detailTab=b.dataset.tab; render(); });
    if(tab==="files"){
      $("#fileAdd").onclick=()=>$("#fileInput").click();
      $("#fileInput").onchange=e=>uploadFiles(c.id, e.target.files);
    }
    if(tab==="comments"){ const add=$("#cmAdd"); if(add) add.onclick=async()=>{ const t=$("#cmText").value.trim(); if(!t) return;
      try{ await api("POST","/api/contracts/"+c.id+"/comments",{text:t}); render(); }catch(err){ toast("⚠️ "+err.message); } }; }
  }

  async function uploadFiles(cid, files, refId){
    for(const f of files){
      if(f.size>25*1024*1024){ toast("⚠️ «"+f.name+"» завеликий (макс. 25 МБ)"); continue; }
      try{
        const dataBase64=await new Promise((res,rej)=>{ const rd=new FileReader(); rd.onload=()=>res(rd.result); rd.onerror=rej; rd.readAsDataURL(f); });
        await api("POST","/api/contracts/"+cid+"/files",{name:f.name,mime:f.type,refId:refId||"",dataBase64});
      }catch(err){ toast("⚠️ "+err.message); }
    }
    toast("Файли завантажено ✓"); render();
  }

  /* ---------- auto-save (delegated) ---------- */
  const saveTimers=new WeakMap();
  function fieldValue(el){
    if(el.dataset.type==="bool") return el.classList.contains("on")?1:0;
    return el.value;
  }
  async function saveField(el){
    const child=el.dataset.child, id=el.dataset.id, f=el.dataset.f;
    try{ await api("PATCH","/api/"+child+"/"+id,{[f]:fieldValue(el)}); refreshStats(); }
    catch(err){ toast("⚠️ "+err.message); }
  }
  function scheduleSave(el){ clearTimeout(saveTimers.get(el)); saveTimers.set(el,setTimeout(()=>saveField(el),600)); }
  const viewEl=$("#view");
  viewEl.addEventListener("input",e=>{ const el=e.target.closest("[data-f]"); if(el&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")&&el.type!=="date") scheduleSave(el); });
  viewEl.addEventListener("change",e=>{ const up=e.target.closest("[data-upfile]"); if(up){ uploadFiles(state.detailId, up.files, up.dataset.upfile); return; } const el=e.target.closest("[data-f]"); if(el) saveField(el); });
  viewEl.addEventListener("click",async e=>{
    const tg=e.target.closest(".toggle[data-type=bool]"); if(tg){ tg.classList.toggle("on"); saveField(tg); return; }
    let m;
    if((m=e.target.closest("[data-add]"))){ try{ await api("POST","/api/contracts/"+state.detailId+"/"+m.dataset.add,{}); render(); }catch(err){ toast("⚠️ "+err.message); } }
    else if((m=e.target.closest("[data-del]"))){ if(confirm("Видалити запис?")){ try{ await api("DELETE","/api/"+m.dataset.del+"/"+m.dataset.delid); render(); }catch(err){ toast("⚠️ "+err.message); } } }
    else if((m=e.target.closest("[data-delfile]"))){ if(confirm("Видалити файл?")){ try{ await api("DELETE","/api/files/"+m.dataset.delfile); render(); }catch(err){ toast("⚠️ "+err.message); } } }
    else if((m=e.target.closest("[data-delcomment]"))){ if(confirm("Видалити коментар?")){ try{ await api("DELETE","/api/comments/"+m.dataset.delcomment); render(); }catch(err){ toast("⚠️ "+err.message); } } }
    else if((m=e.target.closest("[data-delcontract]"))){ if(confirm("Видалити весь договір разом з усіма даними?")){ try{ await api("DELETE","/api/contracts/"+m.dataset.delcontract); go("contracts"); }catch(err){ toast("⚠️ "+err.message); } } }
  });
  let statsT=null;
  function refreshStats(){ if(state.view!=="detail") return; clearTimeout(statsT);
    statsT=setTimeout(async()=>{ try{ const d=await api("GET","/api/contracts/"+state.detailId);
      const st=document.querySelectorAll(".stats .stat .v"); if(st.length>=3){
        st[0].textContent=money(d.contract.totalSum); st[1].textContent=money(d.computed.paid);
        st[2].textContent=money(d.computed.debt); st[2].className="v "+(d.computed.debt>0?"debt":""); }
    }catch(e){} },700);
  }

  /* ---------- profile ---------- */
  $("#profBtn").onclick=openProfile;
  async function openProfile(){
    let data; try{ data=await api("GET","/api/contracts"); }catch(e){ data={users:[],adminId:null,me:state.me}; }
    state.users=data.users; state.adminId=data.adminId; const p=state.me; const isAdmin=p.id===state.adminId;
    const crew=data.users.map(u=>{ const me=u.id===p.id;
      const reset=(isAdmin&&!me)?`<button class="btn ghost sm" data-reset="${u.id}" data-name="${esc(u.name)}">🔑 Скинути пароль</button>`:"";
      const tag=u.id===state.adminId?` · <span class="mut2">адмін</span>`:"";
      return `<div class="crew-row"><span class="av">${esc(initials(u.name))}</span>
        <span style="flex:1"><b>${esc(u.name)}${me?" (ви)":""}</b>${tag}<div class="mut2" style="font-size:12px">${esc(u.email)}</div></span>${reset}</div>`;
    }).join("");
    openSheet(`<div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head"><h2>Профіль</h2><button class="btn ghost sm" id="pLogout">Вийти</button><button class="x" data-close>✕</button></div>
      <div class="sheet-body">
        <div class="field"><label for="pName">Ваше ім'я</label><input class="in" id="pName" value="${esc(p.name)}"></div>
        <div><button class="btn sm" id="pSaveName">Зберегти ім'я</button></div>
        <div class="section-cap">Зміна паролю</div>
        <div class="field"><label for="pwCur">Поточний пароль</label><input class="in" id="pwCur" type="password"></div>
        <div class="row2"><div class="field"><label for="pwNew">Новий пароль</label><input class="in" id="pwNew" type="password" placeholder="Мін. 8"></div>
          <div class="field"><label for="pwNew2">Повторіть</label><input class="in" id="pwNew2" type="password"></div></div>
        <div id="pwMsg" style="display:none;font-size:12px"></div>
        <div><button class="btn ghost sm" id="pwSave">Оновити пароль</button></div>
        <div class="section-cap">Користувачі (${data.users.length})</div>${crew}
        ${isAdmin?"":`<div class="mut2" style="font-size:12px;margin-top:8px">Скидати паролі може лише адміністратор.</div>`}
      </div></div>`);
    $("#pLogout").onclick=async()=>{ try{ await api("POST","/api/auth/logout"); }catch(e){} state.me=null; closeSheet(); showAuth(); };
    $("#pSaveName").onclick=async()=>{ const name=$("#pName").value.trim(); if(!name) return;
      try{ const r=await api("PATCH","/api/me",{name}); refreshTop(r.user); toast("Збережено ✓"); }catch(err){ toast("⚠️ "+err.message); } };
    const pwSave=$("#pwSave"); pwSave.onclick=async()=>{
      const msg=$("#pwMsg"),cur=$("#pwCur").value,nw=$("#pwNew").value,nw2=$("#pwNew2").value;
      const show=(t,ok)=>{ msg.style.display="block"; msg.style.color=ok?"var(--good)":"var(--bad)"; msg.textContent=t; };
      if(!cur||!nw) return show("Заповніть поточний і новий пароль.",false);
      if(nw.length<8) return show("Новий пароль має містити щонайменше 8 символів.",false);
      if(nw!==nw2) return show("Нові паролі не збігаються.",false);
      pwSave.disabled=true;
      try{ await api("POST","/api/me/password",{current:cur,next:nw}); show("Пароль оновлено ✓",true); $("#pwCur").value=$("#pwNew").value=$("#pwNew2").value=""; }
      catch(err){ show("⚠️ "+err.message,false); } finally{ pwSave.disabled=false; }
    };
    $("#scrim").addEventListener("click",function h(e){ const m=e.target.closest("[data-reset]"); if(m){ resetPw(m.dataset.reset,m.dataset.name); } });
  }
  async function resetPw(id,name){
    if(!confirm(`Скинути пароль для «${name}»? Ви отримаєте тимчасовий пароль, щоб передати.`)) return;
    try{ const r=await api("POST","/api/users/"+id+"/reset-password",{});
      openSheet(`<div class="sheet"><div class="sheet-head"><h2>Тимчасовий пароль</h2><button class="x" data-close>✕</button></div>
        <div class="sheet-body"><p class="mut" style="line-height:1.5">Передайте <b style="color:var(--fg)">${esc(r.name||name)}</b> цей пароль. Він увійде з ним, а потім задасть власний у профілі.</p>
        <div class="field"><label>Тимчасовий пароль</label><input class="in" id="tmpPw" readonly value="${esc(r.tempPassword)}" style="font-family:var(--mono);font-weight:700"></div>
        <div><button class="btn" id="tmpCopy">Копіювати</button></div></div></div>`);
      $("#tmpPw").onclick=()=>$("#tmpPw").select();
      $("#tmpCopy").onclick=async()=>{ try{ await navigator.clipboard.writeText(r.tempPassword); toast("Скопійовано ✓"); }catch(e){ $("#tmpPw").select(); } };
    }catch(err){ toast("⚠️ "+err.message); }
  }

  /* ---------- sheet / toast / SSE ---------- */
  const scrim=$("#scrim");
  function openSheet(html){ scrim.innerHTML=html; scrim.hidden=false; document.body.style.overflow="hidden";
    scrim.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeSheet); }
  function closeSheet(){ scrim.hidden=true; scrim.innerHTML=""; document.body.style.overflow=""; }
  scrim.addEventListener("mousedown",e=>{ if(e.target===scrim) closeSheet(); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&!scrim.hidden) closeSheet(); });
  let toastT=null;
  function toast(m){ const el=$("#toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

  let es=null;
  function openSSE(){ teardownSSE(); try{ es=new EventSource("/api/events");
    es.onmessage=()=>{ if(state.view!=="detail") render(); }; es.onerror=()=>{}; }catch(e){} }
  function teardownSSE(){ if(es){ try{es.close();}catch(e){} es=null; } }

  boot();
})();
</script>
</body>
</html>
